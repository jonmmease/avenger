[package]
name = "avenger-lang-analysis"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Editor-neutral language intelligence for Avenger projects"

[dependencies]
async-trait = { workspace = true }
arrow = { workspace = true }
avenger-chart-schema = { path = "../avenger-chart-schema" }
avenger-lang-core = { path = "../avenger-lang-core" }
