[package]
name = "avenger-query-graph"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "A memoized graph of the subplans of DataFusion queries that filter by avenger selections"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
avenger-chart-datafusion = { path = "../avenger-chart-datafusion" }
avenger-common = { path = "../avenger-common" }
avenger-selection = { path = "../avenger-selection" }
avenger-selection-datafusion = { path = "../avenger-selection-datafusion" }
datafusion = { workspace = true }
datafusion-proto-common = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt"] }

# A page runs the computations on its event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"

[dev-dependencies]
avenger-scales = { path = "../avenger-scales" }
# The session of a baked graph, for the test of the file of a real chart's graph.
avenger-sql = { path = "../avenger-sql" }
datafusion = { workspace = true, features = ["sql"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
