[package]
name = "avenger-layout"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Chart-independent layout primitives for arranging rectangular regions whose content rectangles align while edge overflow is synchronized"

[dependencies]

[dev-dependencies]
resvg.workspace = true
avenger-color = { path = "../avenger-color" }
avenger-guides = { path = "../avenger-guides" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-geometry = { path = "../avenger-geometry" }
avenger-common = { path = "../avenger-common" }
avenger-wgpu = { path = "../avenger-wgpu" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
