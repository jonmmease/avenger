[package]
name = "avenger-chart-geo"
version = "0.1.0"
edition = "2024"

[dependencies]
avenger-chart-core = { path = "../avenger-chart-core" }
avenger-chart-marks = { path = "../avenger-chart-marks" }
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-geo = { path = "../avenger-geo" }
avenger-image = { path = "../avenger-image", default-features = false }
avenger-resource = { path = "../avenger-resource" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-text = { path = "../avenger-text" }
async-trait = { workspace = true }
datafusion = { workspace = true }
datafusion-proto = "54.0.0"
indexmap = { workspace = true }
lyon_path = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
typetag = "0.2"

tracing = { workspace = true }

[dev-dependencies]
avenger-app = { path = "../avenger-app" }
avenger-chart = { path = "../avenger-chart", features = ["renderers"] }
avenger-chart-app = { path = "../avenger-chart-app" }
avenger-eventstream = { path = "../avenger-eventstream" }
avenger-svg = { path = "../avenger-svg" }
avenger-wgpu = { path = "../avenger-wgpu" }
arrow = { workspace = true }
bincode = "1.3"
image = { workspace = true }
image-compare = "0.4"
palette = { workspace = true }
resvg = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
