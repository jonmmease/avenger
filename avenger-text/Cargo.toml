[package]
name = "avenger-text"
version = "0.0.8"
edition = "2021"

[features]
serde = ["dep:serde", "avenger-typst-label/serde"]
default = ["serde"]

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
unicode-segmentation = "1.12.0"
lyon_path = { workspace = true }
strum = { workspace = true }
ordered-float = { workspace = true }
svgtypes = { workspace = true }
ttf-parser = { workspace = true }
fontdb = { workspace = true }
brotli = { workspace = true }
avenger-format-datetime = { path = "../avenger-format-datetime" }
avenger-format-number = { path = "../avenger-format-number" }

[dependencies.avenger-typst-label]
path = "../avenger-typst-label"
default-features = false
features = ["raster"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3.77"
