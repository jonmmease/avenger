[package]
name = "avenger-text"
version = "0.0.8"
edition = "2021"

[features]
serde = ["dep:serde", "avenger-typst-label/serde"]
default = ["serde"]

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
image = { workspace = true }
chrono = { workspace = true }
unicode-segmentation = "1.12.0"
lyon_path = { workspace = true }
strum = { workspace = true }
ordered-float = { workspace = true }
fontdb = { workspace = true }
brotli = { workspace = true }
avenger-fonts = { path = "../avenger-fonts" }
avenger-format = { path = "../avenger-format" }

[dependencies.avenger-typst-label]
path = "../avenger-typst-label"
default-features = false
features = ["raster"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3.77"

[dev-dependencies]
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-number-d3 = { path = "../avenger-format-number-d3" }
ttf-parser = { workspace = true }
