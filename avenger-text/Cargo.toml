[package]
name = "avenger-text"
version = "0.0.8"
edition = "2021"

[features]
serde = ["dep:serde"]
default = ["serde"]

# Compatibility aliases while higher crates are simplified. These no longer
# select a backend; the owned Typst engine is the only text backend.
fontdb = []
typst-math = []
typst-math-raster = []
typst-text = []
typst-text-raster = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
image = { workspace = true }
unicode-segmentation = "1.12.0"
lyon_path = { workspace = true }
strum = { workspace = true }
ordered-float = { workspace = true }
svgtypes = { workspace = true }
ttf-parser = { workspace = true }
fontdb = { workspace = true }

[dependencies.avenger-typst]
path = "../avenger-typst"
default-features = false
features = ["owned", "raster"]
