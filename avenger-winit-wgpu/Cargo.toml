[package]
name = "avenger-winit-wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
avenger-resource = { path = "../avenger-resource" }
tracing = { workspace = true }
avenger-common = { path = "../avenger-common" }
avenger-app = { path = "../avenger-app" }
avenger-eventstream = { path = "../avenger-eventstream" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-wgpu = { path = "../avenger-wgpu", default-features = false }
winit = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
cfg-if = { workspace = true }


[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["macros"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt"] }
avenger-wgpu = { path = "../avenger-wgpu", default-features = false, features = [ "rayon"] }
notify = "8.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-trait = { workspace = true }
avenger-image = { path = "../avenger-image" }
avenger-geometry = { path = "../avenger-geometry" }
image = { workspace = true }
