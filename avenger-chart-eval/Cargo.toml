[package]
name = "avenger-chart-eval"
version = "0.1.0"
edition = "2021"
description = "The evaluation of avenger charts to scene graphs at any size"

[dependencies]
arrow = { workspace = true }
avenger-chart = { path = "../avenger-chart" }
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-format = { path = "../avenger-format" }
avenger-geometry = { path = "../avenger-geometry" }
avenger-guides = { path = "../avenger-guides" }
avenger-layout = { path = "../avenger-layout" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["arrow"] }
lyon_path = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-number-d3 = { path = "../avenger-format-number-d3" }
avenger-render-fixtures = { path = "../avenger-render-fixtures" }
avenger-svg = { path = "../avenger-svg" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["arrow", "bundled-fonts"] }
