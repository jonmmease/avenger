[package]
name = "sql-chart"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
avenger-chart = { path = "../../avenger-chart" }
avenger-chart-app = { path = "../../avenger-chart-app" }
avenger-format-datetime-googlesql = { path = "../../avenger-format-datetime-googlesql" }
avenger-format-number-googlesql = { path = "../../avenger-format-number-googlesql" }
avenger-sql = { path = "../../avenger-sql" }
avenger-style = { path = "../../avenger-style" }
avenger-typst-label = { path = "../../avenger-typst-label", features = ["bundled-fonts"] }
avenger-winit-wgpu = { path = "../../avenger-winit-wgpu" }

arrow = { workspace = true }
datafusion = { workspace = true }
pollster = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
