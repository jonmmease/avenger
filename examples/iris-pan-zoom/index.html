<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Pan Zoom WASM</title>
    <style>
        canvas {
            background-color: white;
        }
    </style>
</head>

<body id="wasm-example">
<script type="module">
    const cacheBust = Date.now();
    const { default: init } = await import(`./pkg/iris.js?v=${cacheBust}`);
    console.log("Loading Iris Pan Zoom WASM...");
    init({ module_or_path: `./pkg/iris_bg.wasm?v=${cacheBust}` }).then(() => {
        console.log("Iris Pan Zoom WASM Loaded");
    });
</script>
</body>

</html>
