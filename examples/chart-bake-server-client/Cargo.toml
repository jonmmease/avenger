[package]
name = "chart-bake-server-client"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
avenger-app = { path = "../../avenger-app" }
avenger-chart = { path = "../../avenger-chart", default-features = false }
avenger-chart-app = { path = "../../avenger-chart-app", features = ["winit-wgpu"] }
avenger-resource = { path = "../../avenger-resource" }
bincode = "1.3"
datafusion = { workspace = true, features = ["parquet"] }
env_logger = "0.10"
indexmap = { workspace = true }
log = { workspace = true }
pollster = "0.4.0"
tokio = { workspace = true, features = ["rt", "sync"] }
winit = { workspace = true }
