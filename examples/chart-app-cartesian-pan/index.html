<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenger Chart App Pan Zoom</title>
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #f7f8fb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        #wasm-example {
            background: white;
            box-shadow: 0 12px 36px rgba(20, 28, 42, 0.16);
        }

        canvas {
            display: block;
            background: white;
        }
    </style>
</head>

<body>
    <main id="wasm-example" aria-label="Avenger chart canvas"></main>
    <script type="module">
        const cacheBust = Date.now();
        const { default: init, run, cache_metrics } = await import(`./pkg/chart_app_cartesian_pan.js?v=${cacheBust}`);
        console.log("Loading Avenger chart app WASM...");
        await init({ module_or_path: `./pkg/chart_app_cartesian_pan_bg.wasm?v=${cacheBust}` });
        console.log("Avenger chart app WASM initialized");
        // Physical-cache validation hook: call cache_metrics() in the console.
        window.cache_metrics = cache_metrics;
        await run();
    </script>
</body>

</html>
