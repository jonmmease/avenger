[package]
name = "avenger-chart-definition"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Portable charts that bind dataflow outputs to visual templates"

[dependencies]
avenger-datafusion-dataflow = { path = "../avenger-datafusion-dataflow" }
avenger-layout = { path = "../avenger-layout" }
avenger-panels = { path = "../avenger-panels" }
prost = "0.14.1"
thiserror = { workspace = true }
css-color-parser = { workspace = true }

[build-dependencies]
prost-build = "0.14.1"
protoc-bin-vendored = "3"

[dev-dependencies]
avenger-text = { path = "../avenger-text" }
avenger-scales = { path = "../avenger-scales" }
avenger-chart = { path = "../avenger-chart" }
avenger-transform = { path = "../avenger-transform" }
avenger-winit-wgpu = { path = "../avenger-winit-wgpu" }
avenger-eventstream = { path = "../avenger-eventstream" }
avenger-app = { path = "../avenger-app" }
avenger-geometry = { path = "../avenger-geometry" }
avenger-common = { path = "../avenger-common" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
winit = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
