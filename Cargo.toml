[workspace]
members = [
    "avenger-typst-label",
    "avenger-color",
    "avenger-fonts",
    "avenger-format",
    "avenger-format-number-d3",
    "avenger-format-number-icu",
    "avenger-format-datetime-d3",
    "avenger-format-datetime-chrono",
    "avenger-format-datetime-icu",
    "avenger-scenegraph",
    "avenger-vega-scenegraph",
    "avenger-wgpu",
    "avenger-scales",
    "avenger-guides",
    "avenger-annotation",
    "avenger-common",
    "avenger-geometry",
    "avenger-layout",
    "avenger-layout-gallery",
    "avenger-geo",
    "avenger-guides-geo",
    "avenger-chart",
    "avenger-svg",
    "avenger-pdf",
    "avenger-render-fixtures",
    "avenger-image",
    "avenger-eventstream",
    "avenger-app",
    "avenger-app-tools",
    "avenger-widgets",
    "avenger-datafusion-rasterize",
    "avenger-winit-wgpu",
    "examples/wgpu-scales",
    "examples/wgpu-winit",
    "examples/iris-pan-zoom",
    "examples/movie-search",
    "examples/geo-pan-zoom",
    "examples/point-density",
    "examples/m4-series",
    "examples/image-resources",
    "examples/facet-wrap",
    "examples/cross-filter",
    "examples/egui-embed",
]
exclude = [
    "tools/typst-upstream/references",
    "avenger-vega-test-data",
]

resolver = "2"

[profile.dev]
# Keep edit-build cycles fast without emitting full DWARF for every crate.
debug = "line-tables-only"

[profile.dev.build-override]
debug = 0

[profile.test]
debug = 0
strip = "symbols"

[profile.test.build-override]
debug = 0

[profile.release]
opt-level = 1
codegen-units = 256
debug = 0
strip = "symbols"
incremental = true

[profile.release-perf]
inherits = "release"
opt-level = 3
codegen-units = 16
strip = "symbols"
incremental = false

[profile.release-size]
inherits = "release"
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
incremental = false

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive", "rc"] }
serde_json = "^1.0"
typetag = "0.2"
thiserror = "2.0.12"
lyon_path = "1.0.7"
lyon_extra = "1.0.3"
lyon_algorithms = "1.0.5"
lyon_tessellation = "1.0.15"
lyon = "1.0.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
lazy_static = "1.5.0"
pyo3 = "0.25.1"
pythonize = "0.25.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
rayon = "1.10.0"
winit = "0.30.11"
wgpu = "27.0.1"
palette = "0.7.6"
chrono = "0.4.41"
chrono-tz = "0.10.3"
geo-types = "0.7.19"
geo = "0.33.1"
i_overlay = "4.5.1"
geo-traits = "0.3"
geoarrow-array = "0.9"
geoarrow-schema = "0.9"
geojson = "1.0"
wkb = "0.9"
itertools = "0.14.0"
rstar = "0.13.0"
geo-svg = "0.8.0"
indexmap = { version = "2.9.0", features = ["serde"] }
pollster = "0.4.0"
log = "0.4.27"
ordered-float = "5.0.0"
educe = { version = "0.8.1", default-features = false, features = ["Hash", "PartialEq"] }
tokio = { version = "*" }
async-trait = "0.1"
async-recursion = "1.1.1"
arrow = { version = "59.3" }
arrow-array = { version = "59.3" }
arrow-cast = { version = "59.3" }
arrow-schema = { version = "59.3" }
datafusion = { version = "55.2", default-features = false }
datafusion-proto = { version = "55.2", default-features = false }
css-color-parser = "0.1.2"
paste = "1.0.15"
strum = { version="0.27", features = ["derive"] }
futures = { version = "0.3.31" }
reqwest = { version = "0.12.20", default-features = false }
cfg-if = { version = "1.0.1" }
resvg = { version = "0.45.1" }
usvg = { version = "0.45.1" }
tiny-skia = { version = "0.11.4" }
anyhow = { version = "1.0.98" }
base64 = "0.22.1"
urlencoding = "2.1.3"
pixelmatch = "0.1"
rstest = "0.25.0"
png = "0.18.1"
fontdb = "0.23.0"
rustybuzz = "0.20.1"
ttf-parser = "0.25.1"
brotli = "8.0.1"
font-subset = { version = "0.1.0", features = ["woff2"] }
prost = "0.14.4"
prost-build = { version = "0.14.4", default-features = false }
protoc-bin-vendored = "3.3.0"
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_7763", "image_025", "thread_safe"] }
