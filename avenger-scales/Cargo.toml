[package]
name = "avenger-scales"
version = "0.1.0"
edition = "2021"

[dependencies]
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-format = { path = "../avenger-format" }
avenger-image = { path = "../avenger-image", default-features = false }
thiserror = { workspace = true }
palette = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
indexmap = { workspace = true }
ordered-float = { workspace = true }
lyon_path = { workspace = true }
lyon_extra = { workspace = true }

float-cmp = "0.10.0"
svgtypes = "0.15.1"

arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
typetag = { workspace = true }
datafusion = { workspace = true, optional = true }
datafusion-proto = { workspace = true, optional = true }
paste = { workspace = true }
strum = { workspace = true }
lazy_static = { workspace = true }

# DataFusion's randomness on wasm32 comes from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

[features]
# Scales and domain summaries in DataFusion queries, and serialized plans that hold them.
datafusion = ["dep:datafusion", "dep:datafusion-proto", "dep:getrandom"]

[dev-dependencies]
float-cmp = "0.10.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "linear_scale"
path = "examples/linear_scale.rs"

[[example]]
name = "color_scales"
path = "examples/color_scales.rs"

[[example]]
name = "categorical_scales"
path = "examples/categorical_scales.rs"

[[example]]
name = "logarithmic_scales"
path = "examples/logarithmic_scales.rs"

[[example]]
name = "quantile_threshold"
path = "examples/quantile_threshold.rs"

[[example]]
name = "ticks_and_options"
path = "examples/ticks_and_options.rs"

[[example]]
name = "datafusion_domains"
path = "examples/datafusion_domains.rs"
required-features = ["datafusion"]

[[example]]
name = "datafusion_plan"
path = "examples/datafusion_plan.rs"
required-features = ["datafusion"]

[[test]]
name = "datafusion_scale"
required-features = ["datafusion"]

[[test]]
name = "datafusion_fit"
required-features = ["datafusion"]
