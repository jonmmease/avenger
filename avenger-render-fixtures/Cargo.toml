resvg = { workspace = true }
avenger-annotation = { path = "../avenger-annotation" }
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-geo = { path = "../avenger-geo" }
avenger-guides = { path = "../avenger-guides" }
avenger-guides-geo = { path = "../avenger-guides-geo" }
avenger-image = { path = "../avenger-image" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["bundled-fonts"] }
