[package]
name = "avenger-format-datetime-googlesql"
version = "0.1.0"
edition = "2021"
description = "GoogleSQL's date and time formats: FORMAT_DATE and its siblings, and a datetime format provider"

[dependencies]
avenger-format = { path = "../avenger-format" }
avenger-format-locales-d3 = { path = "../avenger-format-locales-d3" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }

[features]
# All of d3's locales for `Locale::bundled`, where the default build bundles U.S. English.
all-locales = ["avenger-format-locales-d3/all-locales"]

[dev-dependencies]
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-locales-d3 = { path = "../avenger-format-locales-d3", features = ["all-locales"] }
