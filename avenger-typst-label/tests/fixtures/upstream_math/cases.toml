# Inline equations reduced from upstream math tests, one equation per case.
#
# `tools/upstream-typst-probe` writes `ref/{id}.json` from this manifest: the label box's frame
# and each equation's resolved math IR. Display equations become inline ones; `upstream_tests`
# names the tests a case comes from (names are unique across upstream's `tests/suite`).

[defaults]
text_font = "Lato"
math_font = "Lete Sans Math"
font_size = 12.0
font_weight = 500

[[case]]
id = "math-accent-sym-call-1"
source = '$grave(a), acute(b), hat(f), tilde(§), macron(ä), dash(ä), breve(ä)$'
upstream_tests = ["math-accent-sym-call"]
note = 'inline form of a display equation'

