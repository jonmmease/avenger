source = '$display(arccos_x arcsin_x arctan_x arg_x cos_x cosh_x cot_x coth_x csc_x csch_x ctg_x deg_x det_x dim_x exp_x gcd_x lcm_x hom_x id_x im_x inf_x ker_x lg_x lim_x liminf_x limsup_x ln_x log_x max_x min_x mod_x Pr_x sec_x sech_x sin_x sinc_x sinh_x sup_x tan_x tanh_x tg_x tr_x)$'
note = 'every predefined operator, in display style, where the ones with limits put x below'

[[case]]
id = "math-op-predefined-text"
source = '$liminf_(n -> oo) a_n quad display(limsup_(n -> oo) a_n) quad Pr(X) quad sech(x)$'

[[case]]
id = "math-attach-limits-inline-false"
source = '$limits(A, inline: #false)_1^2 != display(limits(A, inline: #false)_1^2) != display(limits(A, inline: #false))_1^2 != display(sum)_(i=0)^n$'
upstream_tests = ["math-attach-show-limit"]
note = 'limits that apply only in display style, without the show rule'

[[case]]
id = "math-semicolon-text"
source = '$x; y$'
note = 'outside call arguments, a semicolon is text'

[[case]]
id = "math-newline-space"
source = "$x\n+ y$"
note = 'a line break in inline math is a space'

[[case]]
id = "math-cancel-length-absolute"
source = '$cancel(x, length: #12pt)$'

[[case]]
id = "math-cancel-stroke-dict"
source = '$cancel(x, stroke: #(thickness: 0.25em, paint: rgb("#85144b"), cap: "round", dash: "dotted"))$'

[[case]]
id = "mathml-dif"
source = '$integral dif x Dif y$'
upstream_tests = ["mathml-dif"]
note = 'the inline form of an HTML test'

[[case]]
id = "math-dif-capital"
source = '$(Dif y)/(Dif x), x Dif y$'

[[case]]
id = "math-lr-shorthand-round"
source = '$round(x/2), round(x, size: #200%), abs(x, size: #2em)$'

[[case]]
id = "math-lr-mid-ungrouped"
source = '$a mid(|) b$'
note = 'a mid delimiter outside any lr group'

[[case]]
id = "math-named-symbols"
source = '$forall x in RR + A subset.eq B + arrow.r.double$'

[[case]]
id = "math-accent-sym-call-4"
source = '$acute.double(a), caron(@), arrow(Z), arrow.l(Z), arrow.l.r(Z)$'
upstream_tests = ["math-accent-sym-call"]
note = 'the third line, inline'

[[case]]
id = "math-style-script-1"
source = '$cal(A) scr(A) bold(cal(O)) scr(bold(O))$'
upstream_tests = ["math-style-script"]
note = 'the first line; the second needs a show rule'

[[case]]
id = "math-style-bold-greek-digits"
source = '$bold(alpha + 2)$'

[[case]]
id = "math-frac-horizontal-explicit"
source = '$frac(a, (b + c), style: "horizontal"), frac(a, b + c, style: "horizontal")$'
upstream_tests = ["math-frac-horizontal-explicit"]
note = 'the set rule replaced by the style argument'

[[case]]
id = "math-underover-one-line-annotations"
source = '$S = overbrace(beta (alpha) S I, "one line") - underbrace(beta (alpha) S I, "one line")$'
upstream_tests = ["math-underover-multiline-annotation"]
note = 'single-line annotations'

[[case]]
id = "math-spacing-wide"
source = '$a wide b$'

# Sources upstream rejects. Their references record upstream's diagnostics.

