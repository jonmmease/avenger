upstream_tests = ["space-collapsing-comments"]

[[case]]
id = "space-collapsing-comments-2"
source = 'A /**/ B/**/C'
upstream_tests = ["space-collapsing-comments"]

[[case]]
id = "space-collapsing-comments-3"
