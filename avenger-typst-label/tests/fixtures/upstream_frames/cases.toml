source = '#calc.round(calc.e, digits: 2) #calc.round(3.5) #calc.round(-48953.45, digits: -3) #calc.round(3333, digits: -2) #calc.round(31114, digits: 4000000000) #calc.round(12.34, digits: -312) #calc.round(-1.7976931348623157e+308, digits: -308)'
