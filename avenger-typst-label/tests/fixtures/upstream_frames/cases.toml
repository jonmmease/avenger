# Labels reduced from upstream text and inline-layout tests.
#
# `tools/typst-upstream/references` writes `ref/{id}.json` from this manifest. Set rules from the
# upstream tests are inlined as arguments, and named colors are written as hex, because labels
# use CSS color names (D22). `upstream_tests` names the tests a case comes from (names are unique
# across upstream's `tests/suite`).

[defaults]
text_font = "Lato"
math_font = "Lete Sans Math"
font_size = 12.0
font_weight = 500

[[case]]
id = "plain-hello"
source = 'Hello world'

[[case]]
id = "plain-kerning"
source = 'AVA Tq WAVE'
upstream_tests = ["text-kerning"]
note = 'default kerning'

[[case]]
id = "plain-ligatures"
source = 'fi fl Qu office'
upstream_tests = ["text-ligatures"]
note = 'default ligatures'

[[case]]
id = "plain-punctuation"
source = 'Hello, world! (1–2) [a] {b}'

[[case]]
id = "plain-digits"
source = '0123456789 3.14'

[[case]]
id = "space-collapsing-comments-1"
