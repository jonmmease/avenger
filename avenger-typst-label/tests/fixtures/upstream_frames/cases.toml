[[case]]
id = "wrap-soft-hyphen"
source = 'Inter-?national-?ization'
width = { max = 60.0 }
note = 'a soft hyphen shows at a wrap'

[[case]]
id = "wrap-repeated-hyphen"
source = 'Um beija-flor'
lang = "pt"
width = { max = 45.0 }
note = 'Portuguese repeats a hyphen at a wrap'

[[case]]
id = "wrap-justified-break"
source = 'Revenue by #linebreak(justify: true) region'
width = { fixed = 120.0 }
note = 'a justified break stretches its line to the width'

[[case]]
id = "wrap-math"
source = 'Fit $y = 2.5 x + 7$ to the data'
width = { max = 60.0 }
note = 'an equation breaks after a relation or an operator'

[[case]]
id = "wrap-math-start"
source = 'Fit of $R^2$'
width = { max = 40.0 }
note = 'an equation that starts a line takes its isolate along (typst#5489)'

[[case]]
id = "wrap-quote-bracket"
source = '“Sales” (USD)'
width = { max = 40.0 }
note = 'a quote before a bracket, which upstream breaks between and labels do not (D27)'

# Aligning lines.

[[case]]
id = "align-center-fixed"
source = 'Revenue by region in millions of dollars'
width = { fixed = 100.0 }
align = "center"

[[case]]
id = "align-right-fixed"
source = 'Revenue by region in millions of dollars'
width = { fixed = 100.0 }
align = "right"

[[case]]
id = "align-end-fixed"
source = 'Revenue by region in millions of dollars'
width = { fixed = 100.0 }
align = "end"

[[case]]
id = "align-center-max"
source = 'Revenue by region in millions of dollars'
width = { max = 100.0 }
align = "center"
note = 'lines center within the widest'

[[case]]
id = "align-center-explicit"
source = 'Revenue \ (millions of dollars)'
align = "center"
note = 'without a width, lines center within the widest'

[[case]]
id = "align-left-rtl"
source = 'שלום עולם זה טקסט ארוך'
dir = "rtl"
width = { fixed = 80.0 }
align = "left"

[[case]]
id = "align-end-rtl"
source = 'שלום עולם זה טקסט ארוך'
dir = "rtl"
width = { fixed = 80.0 }
align = "end"
note = 'end alignment is left in right-to-left text'

[[case]]
id = "align-center-overfull"
source = 'Internationalization of labels'
width = { fixed = 40.0 }
align = "center"
note = 'an overfull line overflows both sides'

[[case]]
id = "align-right-justified-break"
source = 'Revenue by #linebreak(justify: true) region'
width = { fixed = 120.0 }
align = "right"
note = 'a justified line fills the width whatever the alignment'
