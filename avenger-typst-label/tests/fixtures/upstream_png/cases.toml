# PNG references rendered by upstream Typst from the same label source.
#
# `generate_upstream_png_refs` wraps each `src/{id}.typ` in a box on an auto-sized page with a
# 128pt margin and renders it at `72 * scale` ppi (scale 2 unless set). `upstream_tests` names
# the upstream tests a case reduces (names are unique across upstream's `tests/suite`); cases
# without it were written for Avenger's label audits. The comparison is described in
# tests/upstream_png_parity.rs.

[[case]]
id = "text-underline-strike"
upstream_tests = ["underline-overline-strike"]
note = "reduced"
source = "text-underline-strike.typ"
font_size = 20.0
font_weight = 500
text_font = "Lato"
math_font = "Lete Sans Math"

