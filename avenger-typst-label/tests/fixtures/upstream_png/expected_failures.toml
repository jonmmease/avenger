# Cases the current pipeline fails, by check (`metrics` or `ink`), with the reason and the plan
# phase whose new code fixes them. The PNG test fails when a case's failing checks change,
# including when a listed case starts passing.

[[case]]
id = "audit-operator-size-boundary"
fails = ["ink"]
reason = "spacing around an operator next to a size change differs"
fixed_by = "P8"

[[case]]
id = "audit-script-operator"
fails = ["ink"]
reason = "spacing of an operator inside a script differs"
fixed_by = "P8"

[[case]]
id = "audit-script-operator-control"
fails = ["ink", "metrics"]
reason = "spacing of an operator inside a script differs"
fixed_by = "P8"

[[case]]
id = "audit-sub-horizontal-offset"
fails = ["metrics"]
reason = "synthesized subscripts grow the line box; upstream shifts without resizing"
fixed_by = "P4"

[[case]]
id = "audit-sub-partial"
fails = ["metrics"]
reason = "synthesized subscripts grow the line box; upstream shifts without resizing"
fixed_by = "P4"

