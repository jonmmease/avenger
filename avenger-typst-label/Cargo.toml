[package]
name = "avenger-typst-label"
version = "0.1.0"
edition = "2024"

[features]
default = []
raster = ["dep:png", "dep:tiny-skia"]
serde = []
upstream-png-parity = ["dep:brotli", "dep:toml"]
wasm = []

[[bin]]
name = "generate_upstream_png_refs"
required-features = ["upstream-png-parity"]

[[bin]]
name = "typst-label-math-svg-probe"
path = "src/bin/typst_label_math_svg_probe.rs"

[dependencies]
avenger-format = { path = "../avenger-format" }
serde_json = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
fontdb = { workspace = true }
indexmap = { workspace = true }
png = { workspace = true, optional = true }
rustybuzz = { workspace = true }
ttf-parser = { workspace = true }
tiny-skia = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
ecow = "0.2.6"
rustc-hash = "2.1.2"
toml = { version = "0.8.23", default-features = false, features = ["parse", "display"], optional = true }
unicode-bidi = "0.3.18"
unicode-ident = "1.0.24"
unicode-math-class = "0.1"
unicode-script = "0.5.7"
unicode-segmentation = "1.12.0"
unscanny = "0.1.0"

[dev-dependencies]
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-number-d3 = { path = "../avenger-format-number-d3" }
avenger-fonts = { path = "../avenger-fonts" }
brotli = { workspace = true }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[[example]]
name = "gallery"
required-features = ["raster"]
