[package]
name = "avenger-typst-label"
version = "0.1.0"
edition = "2024"

[features]
default = []
raster = ["dep:image", "dep:tiny-skia"]
serde = []
wasm = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
fontdb = { workspace = true }
image = { workspace = true, optional = true }
rustybuzz = { workspace = true }
ttf-parser = { workspace = true }
tiny-skia = { workspace = true, optional = true }
brotli = { workspace = true }
ecow = { version = "0.2.6", features = ["serde"] }
libm = "0.2.16"
once_cell = "1.21.4"
parking_lot = "0.12.5"
portable-atomic = "1.13.1"
rayon = { workspace = true }
rustc-hash = "2.1.2"
semver = "1.0.28"
serde_json = { workspace = true }
siphasher = "1.0.3"
smallvec = { version = "1.15.2", features = ["union", "const_generics", "const_new"] }
thin-vec = "0.2.18"
toml = { version = "0.8.23", default-features = false, features = ["parse", "display"] }
unicode-bidi = "0.3.18"
unicode-ident = "1.0.24"
unicode-math-class = "0.1"
unicode-script = "0.5.7"
unicode-segmentation = "1.12.0"
unscanny = "0.1.0"
