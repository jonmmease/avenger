[package]
name = "avenger-chart-datafusion"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "The DataFusion functions that build avenger charts, the aggregates of the marks and of the compositions, and the codec of the plans that call them"
readme = "README.md"

[dependencies]
arrow = { workspace = true }
avenger-chart = { path = "../avenger-chart", features = ["functions"] }
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-proto = { workspace = true }
datafusion-proto-common = { workspace = true }
prost = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# DataFusion draws identifiers, which need the browser's source of random numbers on the web.
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
datafusion-datasource = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-functions-aggregate = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-plan = { workspace = true }
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# DataFusion's metrics stamp each operator's start and end with chrono's clock, which reads the
# browser's clock only with `wasmbind`.
chrono = { workspace = true, features = ["wasmbind"] }
# DataFusion's execution draws random numbers, which need the browser's source on the web.
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-test = "0.3"
