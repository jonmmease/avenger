[package]
name = "avenger-transform"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Vega-style transforms as DataFusion plans and expressions"
license = "BSD-3-Clause"
readme = "README.md"

[dependencies]
datafusion = { version = "=54.1.0", default-features = false }
datafusion-proto = { version = "=54.1.0", default-features = false }

[dev-dependencies]
avenger-datafusion-aggregate-state = { path = "../avenger-datafusion-aggregate-state" }
datafusion = { version = "=54.1.0", default-features = false, features = ["nested_expressions", "sql"] }
avenger-datafusion-dataflow = { path = "../avenger-datafusion-dataflow", features = ["sql"] }
avenger-datafusion-preaggregate = { path = "../avenger-datafusion-preaggregate", features = ["dataflow"] }
avenger-scales-datafusion = { path = "../avenger-scales-datafusion" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
