[package]
name = "avenger-chart-app"
version = "0.1.0"
edition = "2024"

[features]
default = []
winit-wgpu = [
    "dep:avenger-winit-wgpu",
    "dep:cfg-if",
    "dep:winit",
]

[dependencies]
avenger-app = { path = "../avenger-app" }
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-chart = { path = "../avenger-chart" }
avenger-chart-core = { path = "../avenger-chart-core" }
avenger-chart-treemap = { path = "../avenger-chart-treemap" }
avenger-eventstream = { path = "../avenger-eventstream" }
avenger-geometry = { path = "../avenger-geometry" }
avenger-image = { path = "../avenger-image", default-features = false, features = ["reqwest"] }
avenger-resource = { path = "../avenger-resource" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-winit-wgpu = { path = "../avenger-winit-wgpu", optional = true }

async-trait = { workspace = true }
cfg-if = { workspace = true, optional = true }
datafusion = { workspace = true }
datafusion-proto = { version = "54.0.0", default-features = false }
indexmap = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
typetag = "0.2"
winit = { workspace = true, optional = true }

[dev-dependencies]
avenger-chart-geo = { path = "../avenger-chart-geo" }
avenger-chart-widgets = { path = "../avenger-chart-widgets" }
bincode = "1.3"
image = { workspace = true }
palette = { workspace = true }
serde_json = { workspace = true }
env_logger = "0.10"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
datafusion = { workspace = true, features = ["parquet"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

