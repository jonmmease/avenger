name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rs:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v3
      - name: Install the validated Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "check-linux"
      - name: Check cargo fmt compliance
        run: cargo fmt --all -- --check
      - name: Check no rustc warnings
        run: cargo check --release --workspace --all-targets --locked
      - name: Check for clippy warnings
        run: cargo clippy --release --workspace --all-targets --locked
      - name: Build
        run: |
          cargo build --release --workspace --locked
      - name: Run tests (excluding GPU tests)
        run: |
          cargo test --release --workspace --locked --verbose \
            --exclude avenger-wgpu
      - name: Run doc tests
        run: cargo test --release --workspace --locked --doc --verbose

      - name: Check independent consumer dependency resolution
        run: cargo check --release --manifest-path tests/downstream-consumer/Cargo.toml

      - name: Check browser examples
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --release --locked --target wasm32-unknown-unknown -p iris -p wgpu-scales -p wgpu-winit
