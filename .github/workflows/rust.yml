name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rs:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v3
      # The geo-pan-zoom and movie-search tests embed their examples' data, which lives in Git LFS.
      - name: Pull the example data from Git LFS
        run: git lfs pull --include "avenger-guides-geo/examples/data/*,examples/movie-search/data/*"
      - name: Install the validated Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "check-linux"
      - name: Check cargo fmt compliance
        run: cargo fmt --all -- --check
      - name: Check no rustc warnings
        run: cargo check --release --workspace --all-targets --locked
      - name: Check for clippy warnings
        run: cargo clippy --release --workspace --all-targets --locked
      - name: Build
        run: |
          cargo build --release --workspace --locked
      - name: Run tests (excluding GPU tests)
        run: |
          cargo test --release --workspace --locked --verbose \
            --exclude avenger-wgpu
      - name: Verify layout example measurements
        run: cargo test --release -p avenger-layout-gallery --example chart_grid --locked
      - name: Check and test layout without diagnostics
        run: |
          cargo clippy --release --locked -p avenger-layout --all-targets
          cargo test --release --locked -p avenger-layout
      - name: Install pinned PDF rasterizer
        run: avenger-pdf/scripts/fetch_pdfium.sh
      - name: Verify PDF export images
        env:
          AVENGER_PDFIUM_LIBRARY_PATH: ${{ github.workspace }}/target/pdfium/lib/libpdfium.so
        run: cargo test --release -p avenger-pdf --locked -- --ignored
      - name: Verify Typst layout against upstream PNGs
        run: cargo test --release -p avenger-typst-label --features raster,bundled-fonts,upstream-png-parity --locked
      - name: Test all bundled formatter locales
        run: |
          cargo test --release --locked -p avenger-format-datetime-d3 -p avenger-format-number-d3 \
            -p avenger-format-datetime-chrono \
            --features avenger-format-datetime-d3/all-locales,avenger-format-number-d3/all-locales,avenger-format-datetime-chrono/all-locales
      - name: Test ICU number formatting with debug assertions
        run: cargo test --locked -p avenger-format-number-icu
      - name: Check and test scales in DataFusion queries
        run: |
          cargo clippy --release --locked -p avenger-scales --features datafusion --all-targets
          cargo test --release --locked -p avenger-scales --features datafusion
      - name: Check and test the map plots of charts
        run: |
          cargo clippy --release --locked -p avenger-chart-eval --features geo --all-targets
          cargo test --release --locked -p avenger-chart-eval --features geo
          cargo clippy --release --locked -p avenger-chart-app --features geo --all-targets
          cargo test --release --locked -p avenger-chart-app --features geo
      - name: Run doc tests
        run: cargo test --release --workspace --locked --doc --verbose

      - name: Check browser examples
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --release --locked --target wasm32-unknown-unknown -p iris -p geo-pan-zoom -p wgpu-scales -p wgpu-winit -p avenger-format-datetime-icu -p avenger-format-number-icu -p avenger-typst-label
          cargo check --release --locked --target wasm32-unknown-unknown -p avenger-scales --features datafusion --lib
          cargo check --release --locked --target wasm32-unknown-unknown -p avenger-layout --lib
          cargo check --release --locked --target wasm32-unknown-unknown -p avenger-layout --lib --features diagnostics
          cargo check --release --locked --target wasm32-unknown-unknown -p avenger-chart -p avenger-chart-eval -p avenger-chart-app --lib
          cargo check --release --locked --target wasm32-unknown-unknown -p avenger-chart-eval -p avenger-chart-app --features geo --lib
          cargo check --release --locked --target wasm32-unknown-unknown -p avenger-geo -p avenger-guides-geo --lib
