[package]
name = "avenger-chart-external-test"
version = "0.1.0"
edition = "2021"
description = "Test crate to verify external scale implementations work with avenger-chart"

[dependencies]
avenger-chart = { path = "../avenger-chart" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-guides = { path = "../avenger-guides" }
avenger-common = { path = "../avenger-common" }

datafusion = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
