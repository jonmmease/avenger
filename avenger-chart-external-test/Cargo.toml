edition = "2021"
description = "Test crate to verify external avenger-chart extension points"

[dependencies]
avenger-chart-core = { path = "../avenger-chart-core" }
avenger-chart-marks = { path = "../avenger-chart-marks" }
avenger-chart-cartesian = { path = "../avenger-chart-cartesian" }
avenger-chart-polar = { path = "../avenger-chart-polar" }
avenger-chart-transforms = { path = "../avenger-chart-transforms" }
avenger-color = { path = "../avenger-color" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-guides = { path = "../avenger-guides" }
avenger-common = { path = "../avenger-common" }
