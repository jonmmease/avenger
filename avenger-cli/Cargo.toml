[package]
name = "avenger-cli"
version = "0.1.0"
edition = "2021"
description = "The avenger command-line program: checking and formatting avenger-sql projects, for people, scripts, CI, and agents"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "avenger"
path = "src/main.rs"

[dependencies]
avenger-chart = { path = "../avenger-chart" }
avenger-chart-app = { path = "../avenger-chart-app", features = ["geo"] }
avenger-chart-eval = { path = "../avenger-chart-eval", features = ["geo"] }
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-image = { path = "../avenger-image" }
avenger-pdf = { path = "../avenger-pdf" }
avenger-results-egui = { path = "../avenger-results-egui" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-sql = { path = "../avenger-sql" }
avenger-sql-language = { path = "../avenger-sql-language" }
avenger-sql-project = { path = "../avenger-sql-project" }
avenger-sql-syntax = { path = "../avenger-sql-syntax" }
avenger-style = { path = "../avenger-style" }
avenger-svg = { path = "../avenger-svg" }
avenger-typst-label = { path = "../avenger-typst-label" }
avenger-wgpu = { path = "../avenger-wgpu" }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
datafusion = { workspace = true }
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
# eframe enables egui-wgpu's fix for window contents stretching during a macOS resize only
# through its default features.
egui-wgpu = { version = "0.33.3", default-features = false, features = [
    "macos-window-resize-jitter-fix",
] }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
image = { workspace = true }
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = { workspace = true }
tempfile = "3.14"
tokio = { workspace = true, features = ["macros", "rt"] }
