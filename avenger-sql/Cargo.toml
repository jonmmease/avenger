[package]
name = "avenger-sql"
version = "0.1.0"
edition = "2021"
description = "GoogleSQL pipe queries that build avenger charts, planned onto DataFusion"
readme = "README.md"

[dependencies]
avenger-chart = { path = "../avenger-chart", features = ["functions"] }
avenger-datafusion-transforms = { path = "../avenger-datafusion-transforms" }
avenger-sql-syntax = { path = "../avenger-sql-syntax" }
datafusion = { workspace = true, features = [
    "nested_expressions",
    "datetime_expressions",
    "math_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
prost = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
# The tests of the planner compare its rows with reference queries in DataFusion's SQL.
datafusion = { workspace = true, features = ["sql"] }
avenger-chart-eval = { path = "../avenger-chart-eval", features = ["geo"] }
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-number-d3 = { path = "../avenger-format-number-d3" }
avenger-render-fixtures = { path = "../avenger-render-fixtures" }
avenger-style = { path = "../avenger-style" }
avenger-svg = { path = "../avenger-svg" }
avenger-typst-label = { path = "../avenger-typst-label" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
