[package]
name = "avenger-sql"
version = "0.1.0"
edition = "2021"
description = "GoogleSQL pipe queries that build avenger charts, planned onto DataFusion"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
avenger-chart = { path = "../avenger-chart", features = ["functions"] }
avenger-datafusion-shared = { path = "../avenger-datafusion-shared" }
avenger-datafusion-transforms = { path = "../avenger-datafusion-transforms" }
avenger-format-datetime-googlesql = { path = "../avenger-format-datetime-googlesql", features = [
    "all-locales",
] }
avenger-format-locales-d3 = { path = "../avenger-format-locales-d3" }
avenger-sql-syntax = { path = "../avenger-sql-syntax" }
datafusion = { workspace = true, features = [
    "nested_expressions",
    "datetime_expressions",
    "math_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
chrono = { workspace = true }
futures = { workspace = true }
glob = "0.3"
prost = { workspace = true }
regex = { workspace = true }
regex-syntax = "0.8"
url = "2.5"

[features]
# The formats and compressions of the files of data scripts beyond CSV, JSON and Arrow IPC, which
# DataFusion reads with its features of the same names. A data script that reads a format or a
# compression whose feature a build lacks has an error that names the feature.
parquet = ["datafusion/parquet"]
avro = ["datafusion/avro"]
compression = ["datafusion/compression"]

[dev-dependencies]
arrow = { workspace = true }
# The tests of the planner compare its rows with reference queries in DataFusion's SQL.
datafusion = { workspace = true, features = ["sql"] }
avenger-chart-eval = { path = "../avenger-chart-eval", features = ["geo"] }
avenger-format-number-googlesql = { path = "../avenger-format-number-googlesql" }
avenger-render-fixtures = { path = "../avenger-render-fixtures" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-style = { path = "../avenger-style" }
avenger-svg = { path = "../avenger-svg" }
avenger-typst-label = { path = "../avenger-typst-label" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
