[package]
name = "avenger-scales-datafusion"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "DataFusion expressions and serialization for Avenger scales"

[dependencies]
avenger-scales = { path = "../avenger-scales" }
datafusion = { version = "=54.1.0", default-features = false }
datafusion-proto = { version = "=54.1.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
typetag = "0.2"

[dev-dependencies]
avenger-datafusion-dataflow = { path = "../avenger-datafusion-dataflow" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
