[package]
name = "avenger-query-web"
version = "0.1.0"
edition = "2021"
description = "A WebAssembly library that runs a document's queries in a page, so its avenger charts follow the reader's selections without a server"
license = "BSD-3-Clause"
repository = "https://github.com/jonmmease/avenger"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { workspace = true }
avenger-chart = { path = "../avenger-chart" }
avenger-chart-app = { path = "../avenger-chart-app" }
avenger-chart-web = { path = "../avenger-chart-web" }
avenger-query-graph = { path = "../avenger-query-graph" }
avenger-selection = { path = "../avenger-selection" }
avenger-sql = { path = "../avenger-sql" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
