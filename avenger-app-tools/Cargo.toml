[package]
name = "avenger-app-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow-array = { workspace = true }
async-trait = { workspace = true }
avenger-app = { path = "../avenger-app" }
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-coords = { path = "../avenger-coords" }
avenger-eventstream = { path = "../avenger-eventstream", default-features = false }
avenger-format = { path = "../avenger-format" }
avenger-geo = { path = "../avenger-geo", optional = true }
avenger-geometry = { path = "../avenger-geometry" }
avenger-layout = { path = "../avenger-layout" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["arrow"] }
geo = { workspace = true }
log = { workspace = true }
lyon_path = { workspace = true }
rstar = { workspace = true }
thiserror = { workspace = true }

[features]
# `GeoPanZoom`, which pans and zooms map projections.
geo = ["dep:avenger-geo"]

[dev-dependencies]
avenger-coords = { path = "../avenger-coords", features = ["geo"] }
avenger-typst-label = { path = "../avenger-typst-label", features = ["bundled-fonts"] }
arrow-schema = { workspace = true }
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-number-d3 = { path = "../avenger-format-number-d3" }
pollster = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "navigation"
required-features = ["geo"]

[[test]]
name = "geo_brushes"
required-features = ["geo"]

