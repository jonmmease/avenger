[workspace]
members = [
    "crates/typst-syntax",
    "crates/typst-timing",
    "crates/typst-utils",
]
resolver = "2"

[workspace.package]
version = "0.15.0"
rust-version = "1.91" # Avenger vendor override for current toolchain
authors = ["The Typst Project Developers"]
edition = "2024"
homepage = "https://typst.app"
repository = "https://github.com/typst/typst"
license = "Apache-2.0"
categories = ["compilers"]
keywords = ["typst"]
readme = "README.md"


[workspace.dependencies]
typst-syntax = { package = "avenger-typst-syntax", path = "crates/typst-syntax", version = "0.15.0" }
typst-timing = { package = "avenger-typst-timing", path = "crates/typst-timing", version = "0.15.0" }
typst-utils = { package = "avenger-typst-utils", path = "crates/typst-utils", version = "0.15.0" }
ecow = { version = "0.2.6", features = ["serde"] }
libm = "0.2.11"
once_cell = "1"
parking_lot = "0.12.1"
portable-atomic = "1.6"
rayon = "1.7.0"
rustc-hash = "2.1"
semver = "1"
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1"
siphasher = "1"
smallvec = { version = "1.11.1", features = ["union", "const_generics", "const_new"] }
thin-vec = "0.2.18"
unicode-ident = "1.0"
unicode-math-class = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
unscanny = "0.1"
web-sys = "0.3"

[workspace.lints.clippy]
blocks_in_conditions = "allow"
comparison_chain = "allow"
iter_over_hash_type = "warn"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
mutable_key_type = "allow"
uninlined_format_args = "warn"
wildcard_in_or_patterns = "allow"
# See https://github.com/typst/typst/pull/6560#issuecomment-3045393640
derived_hash_with_manual_eq = "allow"
disallowed_methods = "warn"
