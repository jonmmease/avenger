[package]
name = "avenger-sql-project"
version = "0.1.0"
edition = "2021"
description = "Projects of avenger-sql: the manifest, the file source, the roles of files, the entry stylesheet, loading a project into a DataFusion session, running its chart queries through a store of results, keeping a project live with its analysis in step, the watch of its files, and adding data files"
readme = "README.md"

[dependencies]
avenger-physical-graph = { path = "../avenger-physical-graph" }
avenger-query-graph = { path = "../avenger-query-graph" }
avenger-selection = { path = "../avenger-selection" }
avenger-selection-datafusion = { path = "../avenger-selection-datafusion" }
avenger-sql = { path = "../avenger-sql" }
avenger-sql-language = { path = "../avenger-sql-language" }
avenger-sql-syntax = { path = "../avenger-sql-syntax" }
avenger-format-datetime-googlesql = { path = "../avenger-format-datetime-googlesql" }
avenger-format-number-googlesql = { path = "../avenger-format-number-googlesql" }
avenger-style = { path = "../avenger-style" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["bundled-fonts"] }
bytes = "1.12"
datafusion = { workspace = true }
glob = "0.3"
# The options of a Quarto cell, its leading `#|` lines, are a YAML block.
saphyr = "0.4"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "8.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# DataFusion draws random numbers, which need the browser's source on the web.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
async-trait = { workspace = true }
avenger-chart = { path = "../avenger-chart" }
# The tests of compressed data files read them.
avenger-sql = { path = "../avenger-sql", features = ["compression"] }
tempfile = "3.14"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
