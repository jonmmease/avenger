[package]
name = "avenger-chart-web"
version = "0.1.0"
edition = "2021"
description = "A WebAssembly library that renders avenger chart messages in HTML canvases through WebGPU"
license = "BSD-3-Clause"
repository = "https://github.com/jonmmease/avenger"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
avenger-app = { path = "../avenger-app" }
avenger-chart = { path = "../avenger-chart" }
avenger-chart-app = { path = "../avenger-chart-app" }
avenger-common = { path = "../avenger-common" }
avenger-eventstream = { path = "../avenger-eventstream", default-features = false }
avenger-format-datetime-d3 = { path = "../avenger-format-datetime-d3" }
avenger-format-number-d3 = { path = "../avenger-format-number-d3" }
avenger-style = { path = "../avenger-style" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["bundled-fonts"] }
thiserror = { workspace = true }
ttf-parser = "0.25.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
avenger-wgpu = { path = "../avenger-wgpu", default-features = false }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "AddEventListenerOptions",
    "ClipboardEvent",
    "DataTransfer",
    "console",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "Response",
    "ResizeObserver",
    "ResizeObserverEntry",
    "TouchEvent",
    "TouchList",
    "WheelEvent",
    "Window",
] }
