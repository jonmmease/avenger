[package]
name = "avenger-chart-core"
version = "0.1.0"
edition = "2024"

[dependencies]
avenger-color = { path = "../avenger-color" }
avenger-guides = { path = "../avenger-guides" }
avenger-common = { path = "../avenger-common" }
avenger-format-datetime = { path = "../avenger-format-datetime" }
avenger-format-number = { path = "../avenger-format-number" }
avenger-geometry = { path = "../avenger-geometry" }
avenger-resource = { path = "../avenger-resource" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-text = { path = "../avenger-text" }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
cssparser = "0.35"
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-proto = { version = "54.0.0", default-features = false }
datafusion-proto-common = { version = "54.0.0", default-features = false }
futures = { workspace = true }
indexmap = { workspace = true }
palette = { workspace = true }
paste = { workspace = true }
precomputed-hash = "0.1"
prost = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.0"
selectors = "0.31"
strsim = "0.11"
thiserror = { workspace = true }
tracing = { workspace = true }
typetag = "0.2"

[dev-dependencies]
bincode = "1.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# datafusion-proto compiles its ListingTable ParquetFormat serialization arm
# only under its `parquet` feature (on by default upstream; our base
# dependency disables defaults for wasm builds). Without it, serializing any
# plan that scans parquet fails with a misleading "Error deserializing
# unknown file format: ParquetFormat" internal error. Native builds get the
# feature; wasm builds keep the trimmed dependency exactly as before.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
datafusion-proto = { version = "54.0.0", default-features = false, features = [
    "parquet",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
datafusion = { workspace = true, features = ["parquet"] }
