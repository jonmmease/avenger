[package]
name = "avenger-datafusion-aggregate-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "Materializable aggregate states for Apache DataFusion"
readme = "README.md"

[dependencies]
datafusion = { version = "=54.1.0", default-features = false }
arrow-schema = { version = "58.4.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
datafusion = { version = "=54.1.0", default-features = false, features = ["sql"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "grouped"
harness = false
