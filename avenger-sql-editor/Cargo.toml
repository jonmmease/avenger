[package]
name = "avenger-sql-editor"
version = "0.1.0"
edition = "2021"
description = "A lightweight editor of avenger-sql queries, with a data browser and the charts of each result"
readme = "README.md"

[lib]
# A `cdylib` for the web build, which wasm-pack packages.
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { workspace = true }
avenger-app = { path = "../avenger-app" }
avenger-chart = { path = "../avenger-chart", features = ["functions"] }
# Maps, which the geo samples draw.
avenger-chart-app = { path = "../avenger-chart-app", features = ["geo"] }
avenger-chart-eval = { path = "../avenger-chart-eval", features = ["geo"] }
avenger-common = { path = "../avenger-common" }
avenger-datafusion-transforms = { path = "../avenger-datafusion-transforms" }
avenger-eventstream = { path = "../avenger-eventstream" }
avenger-format-datetime-googlesql = { path = "../avenger-format-datetime-googlesql" }
avenger-format-number-googlesql = { path = "../avenger-format-number-googlesql" }
avenger-image = { path = "../avenger-image", default-features = false }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-sql = { path = "../avenger-sql" }
avenger-sql-language = { path = "../avenger-sql-language" }
avenger-sql-project = { path = "../avenger-sql-project" }
avenger-sql-syntax = { path = "../avenger-sql-syntax" }
avenger-style = { path = "../avenger-style" }
avenger-typst-label = { path = "../avenger-typst-label", features = ["bundled-fonts"] }
# The parallel tessellation of rayon needs threads, so the web build leaves it out.
avenger-wgpu = { path = "../avenger-wgpu", default-features = false }
# The tokens of stylesheets, which color a stylesheet's tab.
cssparser = { workspace = true }
datafusion = { workspace = true, features = [
    "sql",
    "nested_expressions",
    "parquet",
    "datetime_expressions",
    "string_expressions",
    "unicode_expressions",
    "regex_expressions",
] }
eframe = { version = "0.33.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
# eframe enables egui-wgpu's fix for window contents stretching during a macOS resize only
# through its default features.
egui-wgpu = { version = "0.33.3", default-features = false, features = [
    "macos-window-resize-jitter-fix",
] }
egui_table = "0.7.0"
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The fetches of the tiles of maps, which the browser makes with its own `fetch`.
avenger-image = { path = "../avenger-image", default-features = false, features = ["reqwest"] }
avenger-wgpu = { path = "../avenger-wgpu" }
rfd = "0.15"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# The `file:` URL of a file that the editor opens, whose path DataFusion reads without globs.
url = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# DataFusion draws random numbers, which need the browser's source on the web.
getrandom = { version = "0.3", features = ["wasm_js"] }
log = "0.4"
tokio = { workspace = true, features = ["rt", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
# The browser draws with WebGPU where it has it, and with WebGL otherwise.
wgpu = { workspace = true, features = ["webgl", "webgpu"] }

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
