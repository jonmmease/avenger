[upstream]
expected_workspace_version = "0.15.0"

[copy]
# First compile target: enough of Typst to use the real math parser before
# bringing in the broader layout/library stack.
crates = [
  "typst-syntax",
  "typst-timing",
  "typst-utils",
]
root_files = []

[deny_dependencies]
crates = [
  "typst",
  "typst-html",
  "typst-pdf",
  "typst-svg",
  "typst-render",
  "typst-kit",
  "typst-assets",
  "hayagriva",
  "syntect",
  "wasmi",
  "image",
  "usvg",
  "csv",
  "toml",
  "serde_yaml",
  "ciborium",
]
