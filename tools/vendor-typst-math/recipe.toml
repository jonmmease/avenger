[upstream]
expected_workspace_version = "0.15.0"

[copy]
# Math layout target: parser, standard library math/text/layout types, and
# layout. Avenger lowers the accepted math AST directly into Typst math content,
# so the general Typst evaluator and realization crates are intentionally not
# copied.
crates = [
  "typst-layout",
  "typst-library",
  "typst-macros",
  "typst-syntax",
  "typst-timing",
  "typst-utils",
]
root_files = []

[deny_dependencies]
# Rasterization is implemented outside the vendored Typst tree in
# `avenger-typst` behind its `raster` feature using Avenger's workspace
# `tiny-skia` dependency. Keep Typst's renderer stack out of the vendor tree.
crates = [
  "typst",
  "typst-html",
  "typst-pdf",
  "typst-svg",
  "typst-render",
  "typst-kit",
  "typst-assets",
  "typst-dev-assets",
  "hayagriva",
  "hayro-syntax",
  "tiny-skia",
  "syntect",
  "two-face",
  "wasmi",
  "image",
  "usvg",
  "csv",
  "toml",
  "serde_yaml",
  "ciborium",
]
