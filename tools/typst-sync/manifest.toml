# Vendored Typst syntax subset for avenger-typst-label.
#
# Check with `tools/typst-sync/check.sh`; regenerate with `tools/typst-sync/sync.py generate`.
#
# Each generated file is the pinned upstream file minus the whole items listed
# under `remove` (or minus everything not listed under `keep`), followed by the
# crate-path rewrites in sync.py. Items are named by their rustfmt-formatted
# header: `fn name`, `struct Name`, `impl Trait for Type`, `impl Type :: fn m`,
# `mod tests :: fn t`, `use <path>;`. A trailing `*` removes every match.
#
# Upstream files that are not vendored at all:
#   typst-syntax: highlight.rs lines.rs package.rs reparser.rs source.rs
#                 path.rs (replaced by the FileId shim below)
#   typst-utils:  bitset deferred duration fat hash listset macros pico
#                 protected round scalar version
#   typst-timing: lib.rs (replaced by the TimingScope shim below)

[upstream]
repo = "https://github.com/typst/typst"
rev = "9dfd3a08500b7896045f907433cf7b4b02434fad"   # v0.15.1
# The crates.io packages, whose `src/` is byte-identical to `rev`.
version = "0.15.1"
sha256.typst-syntax = "92a20d79df5d10c7fb0b4f7c18e4b2671edfc21e5ed9ad9894e18cccefd1c70f"
sha256.typst-utils = "b33ad1675497b45ae9d960a16e95207c35c2c46330d1a6249a9a977670c8c160"

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/ast.rs"
dst = "src/typst_syntax/upstream/ast.rs"
remove = [
  # Import name resolution needs package specs and filesystem paths.
  "use std::path::Path;",
  "use std::str::FromStr;",
  "use crate::package::PackageSpec;",
  "enum BareImportError",
  # Accessors for code-mode statements, closures, destructuring patterns, and
  # imports, which labels never evaluate. Their node structs stay because `Expr`
  # names them, so the evaluator can still reject them precisely.
  "impl Parenthesized :: fn pattern",
  "impl Named :: fn pattern",
  "impl Spread :: fn sink_ident",
  "impl Spread :: fn sink_expr",
  "impl Closure",
  "node! Params",
  "impl Params",
  "enum Param",
  "impl AstNode for Param",
  "enum Pattern",
  "impl AstNode for Pattern",
  "impl Pattern",
  "node! Underscore",
  "node! Destructuring",
  "impl Destructuring",
  "enum DestructuringItem",
  "impl AstNode for DestructuringItem",
  "enum LetBindingKind",
  "impl LetBindingKind",
  "impl LetBinding",
  "impl DestructAssignment",
  "impl SetRule",
  "impl ShowRule",
  "impl Contextual",
  "impl Conditional",
  "impl WhileLoop",
  "impl ForLoop",
  "impl ModuleImport",
  "enum Imports",
  "node! ImportItems",
  "impl ImportItems",
  "node! ImportItemPath",
  "impl ImportItemPath",
  "enum ImportItem",
  "impl ImportItem",
  "node! RenamedImportItem",
  "impl RenamedImportItem",
  "impl ModuleInclude",
  "impl FuncReturn",
]

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/kind.rs"
dst = "src/typst_syntax/upstream/kind.rs"
remove = [
  # IDE cursor-mode queries (used only by LinkedNode::mode_after).
  "use crate::SyntaxMode;",
  "enum ModeAfter",
  "impl SyntaxKind :: fn mode_after",
  "mod test",
]

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/lexer.rs"
dst = "src/typst_syntax/upstream/lexer.rs"

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/node.rs"
dst = "src/typst_syntax/upstream/node.rs"
remove = [
  "use std::rc::Rc;",
  "use crate::kind::ModeAfter;",
  # Incremental reparsing and span numbering (Source/reparser only).
  "impl SyntaxNode :: fn spanless_eq",
  "impl SyntaxNode :: fn numberize",
  "impl SyntaxNode :: fn is_leaf",
  "impl SyntaxNode :: fn is_inner",
  "impl SyntaxNode :: fn replace_children",
  "impl SyntaxNode :: fn update_parent",
  "impl SyntaxNode :: fn upper",
  "impl InnerNode :: fn numberize",
  "impl InnerNode :: fn spanless_eq",
  "impl InnerNode :: fn replace_children",
  "impl InnerNode :: fn update_parent",
  "type NumberingResult",
  "struct Unnumberable",
  "impl Display for Unnumberable",
  "impl std::error::Error for Unnumberable",
  # IDE tree navigation.
  "struct LinkedNode",
  "impl LinkedNode*",
  "enum Side",
  "impl Deref for LinkedNode",
  "impl Debug for LinkedNode",
  "struct LinkedChildren",
  "impl Iterator for LinkedChildren",
  "impl DoubleEndedIterator for LinkedChildren",
  "impl ExactSizeIterator for LinkedChildren",
  "mod tests :: use crate::Source;",
  "mod tests :: fn test_linked_node",
  "mod tests :: fn test_linked_node_non_trivia_leaf",
]

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/parser.rs"
dst = "src/typst_syntax/upstream/parser.rs"
remove = [
  # Entry points for incremental reparsing.
  "fn reparse_markup",
  "fn reparse_block",
]

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/set.rs"
dst = "src/typst_syntax/upstream/set.rs"

[[file]]
crate = "typst-syntax"
src = "crates/typst-syntax/src/span.rs"
dst = "src/typst_syntax/upstream/span.rs"

[[file]]
crate = "typst-utils"
src = "crates/typst-utils/src/lib.rs"
dst = "src/typst_utils/lib.rs"
keep = [
  "use std::fmt::{Debug, Display, Formatter};",
  "use std::num::{NonZeroU32, NonZeroUsize};",
  "use std::ops::{Add, Deref, DerefMut, Div, Mul, Neg, Sub};",
  "use unicode_math_class::MathClass;",
  "fn debug",
  "trait NonZeroExt",
  "impl NonZeroExt for NonZeroUsize",
  "impl NonZeroExt for NonZeroU32",
  "fn default_math_class",
  "fn defer",
]

# Avenger-owned files (not generated).
[[file]]
mode = "shim"
dst = "src/typst_syntax/lib.rs"     # module root: generated modules and re-exports

[[file]]
mode = "shim"
dst = "src/typst_syntax/path.rs"    # FileId only (no virtual file system)

[[file]]
mode = "shim"
dst = "src/typst_timing/lib.rs"     # no-op TimingScope::new
