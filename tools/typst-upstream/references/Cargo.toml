[package]
name = "typst-upstream-references"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates upstream Typst reference fixtures for avenger-typst-label"

# A standalone workspace: it links upstream Typst from a `../typst` checkout, which CI does not
# have. `Cargo.lock` starts from upstream's own lockfile so shaping dependencies match the pinned
# release; always build with `--locked`.
[workspace]

[dependencies]
brotli-decompressor = "5"
comemo = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
typst = { path = "../../../../typst/crates/typst" }
typst-layout = { path = "../../../../typst/crates/typst-layout" }
