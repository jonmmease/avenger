[package]
name = "avenger-datafusion-transforms"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Vega's bin, stack, impute, lump, and time unit transforms for Apache DataFusion"
readme = "README.md"

[dependencies]
datafusion = { workspace = true, features = ["sql", "nested_expressions"] }
avenger-datafusion-aggregate-state = { path = "../avenger-datafusion-aggregate-state" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
libm = "0.2.16"

# DataFusion's randomness on wasm32 comes from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
