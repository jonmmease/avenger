[package]
name = "avenger-datafusion-transforms"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Vega-style bin, stack, impute, and time unit transforms, and lump, for Apache DataFusion"
readme = "README.md"

[dependencies]
datafusion = { workspace = true, features = ["nested_expressions"] }
avenger-datafusion-aggregate-state = { path = "../avenger-datafusion-aggregate-state" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
libm = { workspace = true }

# DataFusion's randomness on wasm32 comes from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# The tests compare the transforms with reference queries in DataFusion's SQL.
datafusion = { workspace = true, features = ["sql", "nested_expressions"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
