[package]
name = "avenger-lsp"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Native Language Server Protocol adapter for Avenger"

[dependencies]
avenger-lang-analysis = { path = "../avenger-lang-analysis" }
avenger-lang-compiler = { path = "../avenger-lang-compiler" }
avenger-lang-core = { path = "../avenger-lang-core" }
notify = "8.0.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "sync", "time"] }
tower-lsp-server = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
tower = { version = "0.5", features = ["util"] }
