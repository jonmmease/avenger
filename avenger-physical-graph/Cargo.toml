[package]
name = "avenger-physical-graph"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "The DataFusion functions that build avenger charts in physical plans: the aggregates of the marks and of the compositions"
readme = "README.md"

[dependencies]
arrow = { workspace = true }
avenger-chart = { path = "../avenger-chart", features = ["functions"] }
avenger-selection = { path = "../avenger-selection" }
avenger-selection-datafusion = { path = "../avenger-selection-datafusion" }
datafusion-common = { workspace = true }
datafusion-datasource = { workspace = true, features = ["proto"] }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-functions = { workspace = true, features = [
    "datetime_expressions",
    "math_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
datafusion-functions-aggregate = { workspace = true }
datafusion-functions-nested = { workspace = true }
datafusion-functions-window = { workspace = true }
datafusion-physical-plan = { workspace = true, features = ["proto"] }
datafusion-proto = { workspace = true }
datafusion-proto-common = { workspace = true }
prost = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# DataFusion's metrics stamp each operator's start and end with chrono's clock, which reads the
# browser's clock only with `wasmbind`.
chrono = { workspace = true, features = ["wasmbind"] }
# DataFusion draws random numbers and identifiers, which need the browser's source on the web.
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
datafusion = { workspace = true, features = [
    "math_expressions",
    "nested_expressions",
    "sql",
    "string_expressions",
] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
