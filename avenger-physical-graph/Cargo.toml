[package]
name = "avenger-physical-graph"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "The DataFusion functions that build avenger charts in physical plans: the aggregates of the marks and of the compositions"
readme = "README.md"

[dependencies]
arrow = { workspace = true }
avenger-chart = { path = "../avenger-chart", features = ["functions"] }
datafusion-common = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-plan = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# DataFusion's metrics stamp each operator's start and end with chrono's clock, which reads the
# browser's clock only with `wasmbind`.
chrono = { workspace = true, features = ["wasmbind"] }
# DataFusion draws random numbers and identifiers, which need the browser's source on the web.
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
datafusion-datasource = { workspace = true }
datafusion-functions-aggregate = { workspace = true }
futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
