[package]
name = "avenger-datafusion-dataflow"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Parameterized graphs of DataFusion plans and scalar expressions"

[features]
default = []
sql = ["datafusion/sql"]
json = ["dep:serde", "dep:serde_json", "dep:schemars", "dep:url", "sql", "datafusion/parquet"]

[dependencies]
datafusion = { version = "=54.1.0", default-features = false, features = ["nested_expressions", "math_expressions", "datetime_expressions", "string_expressions", "regex_expressions", "unicode_expressions", "recursive_protection"] }
datafusion-datasource = { version = "=54.1.0", default-features = false }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }

datafusion-proto = { version = "=54.1.0", default-features = false }
datafusion-proto-common = { version = "=54.1.0", default-features = false }
prost = "0.14.1"

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { version = "1", optional = true }
url = { version = "2", optional = true }

[build-dependencies]
prost-build = "0.14.1"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
tempfile = "3"

[[example]]
name = "json_dataflow"
required-features = ["json"]

[[example]]
name = "json_schemas"
required-features = ["json"]
