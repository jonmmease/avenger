[package]
name = "avenger-image"
version = "0.1.0"
edition = "2021"

[features]
default = []
svg = [ "resvg", "usvg", "tiny-skia",]
reqwest = [ "dep:reqwest",]
full = ["svg", "reqwest"]

[dependencies]
thiserror = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
cfg-if = { workspace = true }
lazy_static = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
lru = { workspace = true }

reqwest = { workspace = true, optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
resvg = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }

[dependencies.avenger-resource]
path = "../avenger-resource"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["Response", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-time]
version = "1.1.0"
