[package]
name = "avenger-chart"
version = "0.1.0"
edition = "2024"

[dependencies]
avenger-common = { path = "../avenger-common" }
avenger-chart-core = { path = "../avenger-chart-core" }
avenger-chart-legend = { path = "../avenger-chart-legend" }
avenger-chart-marks = { path = "../avenger-chart-marks" }
avenger-chart-scales = { path = "../avenger-chart-scales" }
avenger-chart-cartesian = { path = "../avenger-chart-cartesian" }
avenger-chart-polar = { path = "../avenger-chart-polar" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-app = { path = "../avenger-app"}
avenger-geometry = { path = "../avenger-geometry" }
avenger-text = { path = "../avenger-text" }
avenger-guides = { path = "../avenger-guides" }
avenger-eventstream = { path = "../avenger-eventstream" }
avenger-wgpu = { path = "../avenger-wgpu" }

lazy_static = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-proto = "48.0.1"
datafusion-proto-common = "48.0.1"
prost = "0.13"
futures = { workspace = true }
base64 = { workspace = true }
arrow = { workspace = true }
tokio = { workspace = true, default-features = false }
palette = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
indexmap = { workspace = true }
ordered-float = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.0"
typetag = "0.2"
erased-serde = "0.4.8"

taffy = "0.8.3"
tracing = { workspace = true }
lyon_path = { workspace = true }
paste = "1.0"
postcard = { version = "1.1.3", features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
image-compare = "0.4"
bincode = "1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.14"

[[example]]
name = "simple_bar_chart"
required-features = []
