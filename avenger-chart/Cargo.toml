[package]
name = "avenger-chart"
version = "0.1.0"
edition = "2024"

[features]
default = ["parallel"]
parallel = ["dep:avenger-chart-parallel"]
image-resources = ["dep:avenger-image"]
svg = [
    "dep:avenger-svg",
    "dep:usvg",
    "image-resources",
    "avenger-image/reqwest",
    "avenger-image/svg",
]
pdf = ["dep:avenger-pdf", "svg"]
pdf-krilla-visual-tests = ["visual-tests", "dep:avenger-pdf-krilla"]
wgpu = ["dep:avenger-wgpu"]
doc-render = ["wgpu", "image-resources", "avenger-image/reqwest", "avenger-image/svg"]
renderers = ["svg", "pdf", "wgpu", "doc-render"]
visual-tests = [
    "renderers",
    "dep:image-compare",
    "dep:pdfium-render",
    "dep:resvg",
    "dep:tiny-skia",
    "dep:usvg",
    "dep:avenger-chart-webmercator",
]

[dependencies]
avenger-color = { path = "../avenger-color" }
avenger-common = { path = "../avenger-common" }
avenger-chart-core = { path = "../avenger-chart-core" }
avenger-chart-legend = { path = "../avenger-chart-legend" }
avenger-chart-marks = { path = "../avenger-chart-marks" }
avenger-chart-marks-statistical = { path = "../avenger-chart-marks-statistical" }
avenger-chart-scales = { path = "../avenger-chart-scales" }
avenger-chart-tools = { path = "../avenger-chart-tools" }
avenger-chart-transforms = { path = "../avenger-chart-transforms" }
avenger-chart-cartesian = { path = "../avenger-chart-cartesian" }
avenger-chart-polar = { path = "../avenger-chart-polar" }
avenger-chart-parallel = { path = "../avenger-chart-parallel", optional = true }
avenger-chart-webmercator = { path = "../avenger-chart-webmercator", optional = true }
avenger-layout = { path = "../avenger-layout" }
avenger-scales = { path = "../avenger-scales" }
avenger-scenegraph = { path = "../avenger-scenegraph" }
avenger-geometry = { path = "../avenger-geometry" }
avenger-text = { path = "../avenger-text" }
avenger-guides = { path = "../avenger-guides" }
avenger-image = { path = "../avenger-image", default-features = false, optional = true }
avenger-resource = { path = "../avenger-resource" }
avenger-wgpu = { path = "../avenger-wgpu", optional = true }
avenger-svg = { path = "../avenger-svg", optional = true }
avenger-pdf = { path = "../avenger-pdf", optional = true }
avenger-pdf-krilla = { path = "../avenger-pdf-krilla", optional = true }

lazy_static = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-proto = "48.0.1"
datafusion-proto-common = "48.0.1"
prost = "0.13"
futures = { workspace = true }
base64 = { workspace = true }
arrow = { workspace = true }
tokio = { workspace = true, default-features = false }
palette = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
image-compare = { version = "0.4", optional = true }
indexmap = { workspace = true }
ordered-float = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.0"
typetag = "0.2"
erased-serde = "0.4.8"

tracing = { workspace = true }
lyon_path = { workspace = true }
paste = "1.0"
usvg = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
pdfium-render = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bincode = "1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.14"

[[example]]
name = "simple_bar_chart"
required-features = ["wgpu"]

[[example]]
name = "responsive_wrap_png_replay"
required-features = ["wgpu"]

[[example]]
name = "nested_facet_pan_png_replay"
required-features = ["wgpu"]

[[example]]
name = "facet_instanced_pan_png_replay"
required-features = ["wgpu"]

[[example]]
name = "simple_instanced_pan_png_replay"
required-features = ["wgpu"]

[[example]]
name = "test_legend_height"
required-features = ["doc-render"]

[[example]]
name = "test_polar_basic"
required-features = ["wgpu"]
