// The serialized form of an avenger-chart `Chart`.
//
// A serialized chart is one `Chart` message. In an Arrow table, a chart is a `Binary`,
// `LargeBinary`, or `BinaryView` value whose field has the metadata
// `ARROW:extension:name = avenger.chart`.
//
// Data tables, constants, explicit domains, domain summaries, and explicit ranges are Arrow IPC
// streams inside the message, so each keeps its exact Arrow type. Each IPC stream holds a schema
// and one record batch, written with the default IPC writer options, which place each buffer at a
// multiple of 64 bytes from the start of the stream. The IPC stream of each table starts at a
// multiple of 64 bytes from the start of the chart, so a reader whose chart starts at a multiple of
// 64 bytes decodes the columns of every table in place, without a copy.
//
// The format has no `map` fields, and each repeated field has a fixed order, so equal charts
// encode to equal bytes. A string field that is empty means that the value is not set, and the
// zero value of each enum, `*_UNSPECIFIED`, is not valid where the comments of the format do not
// give it a meaning.
//
// This file holds the tree of a chart and the layout options of concats. The other files of
// package `avenger.chart.v1` hold the other parts of its nodes.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/attribution.proto";
import "avenger/chart/v1/coord.proto";
import "avenger/chart/v1/encoding.proto";
import "avenger/chart/v1/facet.proto";
import "avenger/chart/v1/guide.proto";
import "avenger/chart/v1/interaction.proto";
import "avenger/chart/v1/mark.proto";
import "avenger/chart/v1/partition.proto";
import "avenger/chart/v1/resolve.proto";
import "avenger/chart/v1/selection.proto";
import "avenger/chart/v1/style.proto";

// A chart. Combining charts places their roots under a new concat, wrap, or overlay, and keeps
// their tables, nodes, interactions, and selections:
//
// - Units whose tables encode to equal bytes refer to one entry of `tables`.
// - The builder moves the partition values that every child shares to the new node, as
//   `PartitionValue` describes.
// - Two nodes with one id must have different partitions, so the combination fails when the
//   children hold two nodes with the same id and the same partition.
// - Selections with one name become one selection. Their resolutions must be equal, and their
//   initial contributions join.
// - The scale specs of the units that share a scale must agree, as `ScaleSpec` describes.
// - The nodes inside an overlay have no titles and no attributions, because the overlay draws one
//   plot, so the builder drops the titles of the charts that it combines into an overlay and
//   moves their credits to the overlay's attribution, in order and each credit once.
message Chart {
  // The format version, which is 1 for these files. A reader rejects every other version. Bytes
  // that are not a chart decode with version 0, so the version also identifies chart bytes in a
  // column that lost its extension name. A change that an older reader cannot read gives a new
  // version, and this field keeps its number in every version.
  uint32 version = 1;
  // The distinct data tables of the chart, and `Unit.table` refers to a table by its position in
  // this list. Units whose tables encode to equal IPC bytes refer to one entry.
  repeated Table tables = 2;
  Node root = 3;
  // The selections of the chart, in the order of their names, with each name at most once.
  repeated Selection selections = 4;
}

// A data table of a chart: an IPC stream of one record batch, after padding that aligns it.
message Table {
  // Zeros that put the start of `ipc` at a multiple of 64 bytes from the start of the chart, or
  // empty when it starts there without them. The padding depends only on the bytes before it, so
  // equal charts still encode to equal bytes. A reader skips it.
  bytes padding = 1;
  bytes ipc = 2;
}

// A node of the tree. Its id, when it has one, and its partition identify it: two nodes with one
// id have different partitions, so the charts of the facets of one table can give their plots one
// id. A contribution names the plot that wrote it by both, and an app carries the views and the
// selections of a plot to a new chart by both, so the plot of a facet keeps them when a new query
// reorders the facets or drops some of them.
message Node {
  oneof node {
    Unit unit = 1;
    Overlay overlay = 2;
    Concat concat = 3;
    Wrap wrap = 4;
    Empty empty = 5;
  }
}

// A child of a row, a column, or a wrap that keeps its position in the tracks and draws nothing.
message Empty {
  // The partition values of a facet without data, in the order of their columns, with each column
  // at most once, and no column that an ancestor declares. A child of a facet declares the facet's
  // column, so the header labels the empty cell.
  repeated PartitionValue partition = 1;
}

// One mark over one data table, which draws one plot.
message Unit {
  // An id, or empty. With the partition, it identifies the unit, as `Node` describes. A plot
  // without an id is named by its node path.
  string id = 1;
  // The position of the unit's table in `Chart.tables`.
  uint32 table = 2;
  Mark mark = 3;
  // At most one encoding for each channel, in the order of `Channel`.
  repeated Encoding encodings = 4;
  // The coordinate system of the plot. When it is not set, a unit inside an overlay takes the
  // coordinate system of the overlay, and other units are Cartesian.
  Coord coord = 5;
  // The title of the plot. A unit inside an overlay has none.
  Title title = 6;
  // The interactions of the unit, in the order of their declarations. A unit that declares an
  // interaction has an id, so an app can carry its views and selections to a new chart by its id
  // and its partition.
  repeated Interaction interactions = 7;
  // The partition values of the unit, in the order of their columns, with each column at most once,
  // and no column that an ancestor declares.
  repeated PartitionValue partition = 8;
  // The credits of the plot's sources. When it is not set, the plot has no attribution. A unit
  // inside an overlay has none, because the overlay's attribution credits its sources.
  Attribution attribution = 9;
}

// Children that draw into one plot.
message Overlay {
  // An id, or empty, as for a unit.
  string id = 1;
  // Units and overlays.
  repeated Node children = 2;
  // The coordinate system of the plot. Each child that sets one must set the same one. The
  // children of a map plot share its projection, because they draw into one plot.
  Coord coord = 3;
  // Rules for the channels whose sharing differs from the default of an overlay, which shares
  // every channel. In the order of `Channel`, with at most one rule for each channel.
  repeated Resolve resolve = 4;
  // The title of the plot. An overlay inside an overlay has none.
  Title title = 5;
  // The interactions of the overlay, in the order of their declarations. An overlay that
  // declares an interaction has an id.
  repeated Interaction interactions = 6;
  // The partition values of the overlay, in the order of their columns, with each column at most
  // once, and no column that an ancestor declares.
  repeated PartitionValue partition = 7;
  // The credits of the plot's sources, as for a unit. An overlay inside an overlay has none.
  Attribution attribution = 8;
}

// Children placed in a row or a column.
message Concat {
  // An id, or empty, as for a unit.
  string id = 1;
  Direction direction = 2;
  // Nodes of any kind.
  repeated Node children = 3;
  // Rules for the channels whose sharing differs from the default of a concat, in which `x`, `y`,
  // `theta`, and `radius` are independent and every other channel is shared, or with a facet,
  // every channel is shared. In the order of `Channel`, with at most one rule for each channel.
  repeated Resolve resolve = 4;
  ConcatLayout layout = 5;
  Title title = 6;
  // The sharing of the projections of the map plots below the concat. When it is not set, each
  // child has its own projection, or with a facet, the children share one. Map plots that share a
  // projection fit one view and get equal sizes, so a place lands at the same position in each of
  // them.
  Sharing projection = 7;
  // The partition values of the concat, in the order of their columns, with each column at most
  // once, and no column that an ancestor declares.
  repeated PartitionValue partition = 8;
  // The partition column that the children split, and the header that labels them. A concat with
  // a facet is a row or a column of a facet grid.
  Facet facet = 9;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_ROW = 1;
  DIRECTION_COLUMN = 2;
}

// The layout options of a concat. They lower to avenger-layout, but the format holds its own
// types, so it does not change when avenger-layout changes its API.
message ConcatLayout {
  // The space between children, in pixels. When it is not set, the theme gives it.
  optional float gap = 1;
  // One track for each child, in the order of the children, or no tracks, which gives each
  // child a share of weight 1. A child that is a concat in the same direction places its
  // children in the tracks of this concat, so its entry is an empty `Track`, and its own layout
  // sets the tracks of its children. Nested concats place their children in one table of tracks,
  // so a column of rows lines up the children of its rows, and concats that set the same track
  // of the table must set equal tracks.
  repeated Track tracks = 2;
  // Rules for the guide parts whose rule differs from the default, in the order of `GuidePart`,
  // with at most one rule for each part. The default collapses the ticks and the labels of an
  // axis, merges the title of an axis, legends, colorbars, and attributions, and collapses the
  // labels and the title of a facet header. The rules apply to the guides of the scales that the
  // concat owns: the scales that it shares, and the share families whose units are all below it.
  // The rules for the parts of facet headers and for attributions apply to the headers of the
  // facets and to the attributions of the plots below the concat.
  repeated GuideRule guide_rules = 3;
  // Where the outermost concat of a table puts the width that its tracks leave. Shares take the
  // free length first, so width is left only when every horizontal track has a fixed length or
  // a share at its maximum. Only the outermost concat of a table can set it, because it sizes the
  // tracks of every concat inside it: the root, or a concat that is a child of a wrap, which
  // starts a table of its own. The tracks across the direction of that concat come from the
  // concats of the other direction inside it, so the distribution across that direction applies
  // only when those concats set fixed lengths or maximums.
  Distribute horizontal_distribute = 4;
  // Where the outermost concat of a table puts the height that its tracks leave, as for
  // `horizontal_distribute`.
  Distribute vertical_distribute = 5;
}

// Children placed in rows of equal columns, as many columns as fit the width of the wrap, so a
// wrapped facet grid reflows as the chart resizes. A short last row leaves its last cells empty,
// and an axis that collapses along a column stands below the lowest child of the column.
//
// A wrap starts a table of tracks of its own, so the plots inside it line up with each other and
// not with the plots outside it. Each child takes one cell. A concat in a cell starts a table of
// its own too.
message Wrap {
  // An id, or empty, as for a unit.
  string id = 1;
  // Nodes of any kind, in the order that fills the rows.
  repeated Node children = 2;
  // Rules for the channels whose sharing differs from the default, which is the default of a
  // concat, with or without a facet, in the order of `Channel`, with at most one rule for each
  // channel.
  repeated Resolve resolve = 3;
  WrapLayout layout = 4;
  Title title = 5;
  // The sharing of the projections of the map plots below the wrap, as for a concat.
  Sharing projection = 6;
  // The partition values of the wrap, in the order of their columns, with each column at most once,
  // and no column that an ancestor declares.
  repeated PartitionValue partition = 7;
  // The partition column that the children split, and the header that labels each child. A wrap
  // with a facet is a wrapped facet grid.
  Facet facet = 8;
}

// The layout options of a wrap. A field that is not set takes the value of the theme.
message WrapLayout {
  // The narrowest width of a column, in pixels. The wrap takes the most columns that fit its
  // width at this width or wider, and at least one.
  optional float min_column_width = 1;
  // The most columns at any width.
  optional uint32 max_columns = 2;
  // The height of each row.
  Track row = 3;
  // The space between columns and between rows, in pixels.
  optional float gap = 4;
  // Rules for the guide parts whose rule differs from the default, as for a concat, except that
  // the default merges the title of a facet header, because each child has a header of its own.
  // Collapse runs along the columns and the rows of the wrap.
  repeated GuideRule guide_rules = 5;
  // Where the wrap puts the height that its rows leave. Its columns fill its width.
  Distribute distribute = 6;
}

// The size of a child along the direction of its concat, or of a row of a wrap.
message Track {
  oneof size {
    // A fixed length, in pixels.
    float length = 1;
    Share share = 2;
  }
}

// A share, by weight, of the length that the fixed tracks and the gaps leave.
message Share {
  float weight = 1;
  // The largest length of the track, in pixels. When it is not set, the track has no maximum.
  optional float max = 2;
}

enum Distribute {
  // The length stays after the last track, as for `DISTRIBUTE_START`.
  DISTRIBUTE_UNSPECIFIED = 0;
  DISTRIBUTE_START = 1;
  DISTRIBUTE_CENTER = 2;
  DISTRIBUTE_END = 3;
  // The same length in every gap.
  DISTRIBUTE_SPACE_BETWEEN = 4;
  // The same length on both sides of every track, so the length before the first track and
  // after the last is half of what each gap gains.
  DISTRIBUTE_SPACE_AROUND = 5;
  // The same length in every gap, before the first track, and after the last.
  DISTRIBUTE_SPACE_EVENLY = 6;
}

// A title of a node: its text, with an optional subtitle after it, on one side of the node. A
// title runs along the whole side of the node's box, over the slabs of its guides, and a title at
// the bottom serves as a caption. A style field that is not set takes the value of the theme.
message Title {
  string text = 1;
  TitleSide side = 2;
  // How the text engine reads the text and the subtitle.
  TextSyntax syntax = 3;
  TextStyle style = 4;
  // A line of text after the text, such as the units or the period of the data, or empty for no
  // subtitle.
  string subtitle = 5;
  TextStyle subtitle_style = 6;
  // Where the title stands along its side. When it is not set, the theme gives it.
  TitleAlign align = 7;
}

enum TitleSide {
  TITLE_SIDE_UNSPECIFIED = 0;
  TITLE_SIDE_TOP = 1;
  TITLE_SIDE_LEFT = 2;
  TITLE_SIDE_RIGHT = 3;
  TITLE_SIDE_BOTTOM = 4;
}

// A place along a side, in the direction that the title reads: from the left of a title at the
// top or the bottom, up a title on the left, and down a title on the right.
enum TitleAlign {
  TITLE_ALIGN_UNSPECIFIED = 0;
  TITLE_ALIGN_START = 1;
  TITLE_ALIGN_CENTER = 2;
  TITLE_ALIGN_END = 3;
}
