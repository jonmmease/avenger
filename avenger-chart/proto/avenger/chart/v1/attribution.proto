// Attributions, which credit the sources of the data of a plot.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/side.proto";
import "avenger/chart/v1/style.proto";

// Credits on a side of a plot, such as `Source: BLS`, or the credits of the tiles of a map. Plots
// with equal credits merge their attributions by default, so a facet grid shows its sources once. A
// style field that is absent takes the value of the theme.
message Attribution {
  // Each credit as Typst markup, such as `© OpenStreetMap contributors`. No credits draws no
  // attribution.
  repeated string credits = 1;
  // The top or the bottom of the plot. When absent, the theme gives it. A left or a right side is
  // invalid.
  Side side = 2;
  // Where the credits stand along the side.
  AttributionAlign align = 3;
  // Typst markup between two credits on a line.
  string separator = 4;
  // The space on each side of the separator, in pixels.
  optional float separator_space = 5;
  // The style of the credits.
  TextStyle text_style = 6;
  // The space between lines of credits, in pixels.
  optional float line_gap = 7;
  // The box behind the credits. When absent, the credits have no background.
  Background background = 8;
}

enum AttributionAlign {
  // Absent, so the theme gives the alignment.
  ATTRIBUTION_ALIGN_UNSPECIFIED = 0;
  // The start, as the left of a line of text.
  ATTRIBUTION_ALIGN_START = 1;
  // The end, as web maps and figure captions place credits.
  ATTRIBUTION_ALIGN_END = 2;
}
