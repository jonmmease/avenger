// The choice of the guide of a scale, and the rules that concats apply to guides. Each kind of
// guide has its own file: `Axis` and `PolarAxis` are in `axis.proto`, `Legend` and `Colorbar` are
// in `legend.proto`, and `FacetHeader` is in `facet.proto`. The titles, labels, ticks, and grid
// lines that they share are in `guide_element.proto`.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/annotation.proto";
import "avenger/chart/v1/axis.proto";
import "avenger/chart/v1/legend.proto";

message Guide {
  oneof guide {
    Axis axis = 1;
    Legend legend = 2;
    Colorbar colorbar = 3;
    // No guide, so the scale draws none.
    NoGuide none = 4;
    PolarAxis polar_axis = 5;
  }
}

message NoGuide {}


// A part of the guides of a scale or of a facet header, which the guide rules of a concat keep,
// collapse, or merge.
enum GuidePart {
  // Not valid.
  GUIDE_PART_UNSPECIFIED = 0 [(avenger.chart.v1.invalid) = true];
  // The ticks of an axis.
  GUIDE_PART_AXIS_TICKS = 1;
  // The tick labels of an axis.
  GUIDE_PART_AXIS_LABELS = 2;
  // The title of an axis.
  GUIDE_PART_AXIS_TITLE = 3;
  // A symbol legend.
  GUIDE_PART_LEGEND = 4;
  // A colorbar.
  GUIDE_PART_COLORBAR = 5;
  // The labels of a facet header, with its rule and ticks.
  GUIDE_PART_HEADER_LABELS = 6;
  // The title of a facet header.
  GUIDE_PART_HEADER_TITLE = 7;
  // The attribution of a plot.
  GUIDE_PART_ATTRIBUTION = 8;
}

// The rule of one guide part among the plots of a concat.
message GuideRule {
  // The part that the rule applies to.
  GuidePart part = 1;
  // What the concat does with the part.
  GuideRuleKind rule = 2;
}

enum GuideRuleKind {
  // Not valid.
  GUIDE_RULE_KIND_UNSPECIFIED = 0 [(avenger.chart.v1.invalid) = true];
  // One guide for each plot.
  GUIDE_RULE_KIND_KEEP = 1;
  // One guide for each lane of plots that line up.
  GUIDE_RULE_KIND_COLLAPSE = 2;
  // One guide for the concat.
  GUIDE_RULE_KIND_MERGE = 3;
}
