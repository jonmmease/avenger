// The coordinate systems of plots. Each coordinate system has its own file.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/cartesian.proto";
import "avenger/chart/v1/geo.proto";
import "avenger/chart/v1/polar.proto";

// The options of the coordinate system of a plot, which are of the kind of its marks.
message Coord {
  oneof coord {
    Cartesian cartesian = 1;
    Geo geo = 2;
    Polar polar = 3;
  }
}
