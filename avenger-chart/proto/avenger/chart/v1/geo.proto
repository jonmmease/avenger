// The geo coordinate system and its plots.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/annotation.proto";
import "avenger/chart/v1/element.proto";
import "avenger/chart/v1/option.proto";

// A geographic coordinate system: a map projection of `longitude`, `latitude`, `longitude2`,
// `latitude2`, and `geometry`, for the `geo_` marks. A plot in this coordinate system is a geo
// plot. The chart stores the spec, and the renderer builds the projection from it and fits its view
// at the size of each plot.
//
// The geo plots that share a projection merge their data and show one view, so their projections,
// their graticules, their spheres, their tiles, their aspects, and their navigation must be equal.
message Geo {
  // The projection, with its parameters.
  Projection projection = 1 [(avenger.chart.v1.required) = true];
  // The share family. Geo plots whose specs name one family share one projection, in addition
  // to the projections that resolve rules share.
  string family = 2;
  // The shape of the plot. When unset, the plot keeps the aspect ratio of what its view fits,
  // inside the space that the layout gives it, so the projection fills the plot.
  oneof aspect_ratio {
    // A fixed width over height, which the plot keeps inside the space that the layout gives
    // it. The view fills the plot in one direction and centers in the other.
    float ratio = 3;
    // No aspect ratio: all of the space that the layout gives the plot, in any shape. The view
    // fills the plot in one direction and centers in the other, so a geo plot that fits a box
    // shows more of the places around the box.
    NoAspectRatio none = 4;
  }
  // How a navigation moves the projection. When unset, a navigation moves the projection in its
  // own pan mode, and its zoom has no limits.
  GeoNavigation navigation = 5;
  // The lines of longitude and latitude. When unset, the plot has no graticule. A projection of
  // the type `identity` has none.
  Graticule graticule = 6;
  // Whether the plot draws the sphere, the whole world of the projection, filled behind the data
  // and outlined. When unset, it does not. A projection of the type `identity` has none.
  optional bool sphere = 7;
  // The CSS color of the sphere behind the data. When it is empty, the styles give it.
  string sphere_fill = 8;
  // The CSS color of the sphere's outline. When it is empty, the styles give it.
  string sphere_stroke = 9;
  // The width of the sphere's outline, in pixels. When unset, the styles give it.
  optional float sphere_stroke_width = 10;
  // Raster tiles behind the data, such as a street map. When unset, the map has no tiles. A
  // projection of the type `identity` has none.
  TileLayer tiles = 11;
}

message NoAspectRatio {}

// How a navigation moves the projection of a geo plot, which every geo plot that shares the
// projection moves alike.
message GeoNavigation {
  // How a drag moves the projection. Without a mode, the projection's own mode:
  // `PAN_MODE_TRANSLATE` for a projection of the type `identity`, which takes no other mode, `PAN_MODE_SPHERE` for a projection whose default
  // clip is a circle, as an azimuthal projection's is, and `PAN_MODE_LONGITUDE` otherwise.
  PanMode pan_mode = 1;
  // How far the wheel zooms out and in, as factors of the scale of the fitted projection at the
  // plot's size, so a `min_zoom` of 1 stops a zoom out at the fitted view. Without a limit, the
  // zoom has none in that direction.
  optional double min_zoom = 2;
  // As for `min_zoom`, the limit of a zoom in.
  optional double max_zoom = 3;
}

// How a navigation moves a geo plot. Each keeps the place under the pointer at the start of a drag
// under the pointer.
enum PanMode {
  // Unset, so the projection's own mode applies, as `GeoNavigation.pan_mode` describes.
  PAN_MODE_UNSPECIFIED = 0;
  // A drag slides the view, and the wheel zooms about the pointer.
  PAN_MODE_TRANSLATE = 1;
  // A drag turns the sphere about its axis for horizontal movement and slides the view for
  // vertical movement, as world maps pan.
  PAN_MODE_LONGITUDE = 2;
  // A drag turns the sphere the shortest way that carries the place to the pointer, as a
  // trackball turns.
  PAN_MODE_SPHERE = 3;
}

// A map projection: its type, the parameters of its type, and how it rotates, centers, clips,
// resamples, and fits. The reader checks that each parameter is one that the projection's type
// takes.
message Projection {
  // The type of the projection, a projection of the renderer or one that an app adds.
  oneof type {
    option (avenger.chart.v1.required_oneof) = true;
    option (avenger.chart.v1.lift_oneof) = true;
    // A projection of the renderer.
    ProjectionType builtin = 1 [(avenger.chart.v1.required) = true];
    // A projection that an app adds to its renderer.
    CustomProjection custom = 2;
  }
  // The standard parallels of a conic projection, one or two, in degrees from -90 to 90. One
  // parallel, or two equal ones, make a conic with one standard parallel. When unset, 30 and 30
  // for `conic_conformal`, and 0 and 60 for `conic_equal_area` and `conic_equidistant`, as in
  // d3-geo.
  repeated double parallels = 3;
  // The standard parallel of `cylindrical_equal_area`, in degrees from -90 to 90. When unset,
  // 38.58, the parallel of the Hobo-Dyer projection.
  optional double parallel = 4;
  // The coefficient of `hammer`, at least 1: 1 gives the azimuthal equal-area projection, and 2
  // the Hammer projection. When unset, 2.
  optional double coefficient = 5;
  // Whether the x axis of `identity` flips, for coordinates whose x grows to the left.
  bool reflect_x = 6;
  // Whether the y axis of `identity` flips, for coordinates whose y grows upward.
  bool reflect_y = 7;
  // The rotation of the sphere before it projects, in degrees, as d3-geo's `rotate` takes it: the
  // yaw, the turn about the polar axis, then the pitch, and an optional roll, so two or three
  // numbers. When unset, the sphere does not rotate.
  repeated double rotate = 8;
  // The place at the center of the view, as its longitude in degrees east and its latitude in
  // degrees north. When unset, longitude 0 and latitude 0.
  repeated double center = 9;
  // The part of the sphere that the projection keeps. When unset, the projection keeps its default
  // part, such as the near hemisphere of `orthographic`.
  SphericalClip clip = 10;
  // The resampling precision, in pixels, or 0 for no resampling. When unset, the square root of
  // 0.5, as in d3-geo.
  optional double precision = 11;
  // What the view fits. When unset, the view fits the data of the plot's layers.
  oneof fit {
    // The data of the plot's layers. The renderer summarizes the geometry of each `geo_shape` layer
    // and the positions of the other layers, and insets the fit by the largest reach of their
    // marks, so a mark at the edge of the data stays inside the plot. The plot clips to its
    // rectangle, because its graticule, its sphere, and its tiles run past the data.
    PlotData data = 12;
    // The whole sphere, as a world map or a globe shows it.
    WholeSphere whole_sphere = 13;
    // A box of longitudes and latitudes. The plot clips its marks, because the box can exclude
    // data.
    FitBox box = 14;
  }
}

// The projections of the renderer.
enum ProjectionType {
  // Unset, which a projection does not take.
  PROJECTION_TYPE_UNSPECIFIED = 0;
  // Coordinates that are already projected, as d3-geo's `geoIdentity` takes them. They do not
  // rotate, clip to the sphere, or resample, and they fit the data of the plot's layers.
  PROJECTION_TYPE_IDENTITY = 1;
  // The Equal Earth projection.
  PROJECTION_TYPE_EQUAL_EARTH = 2;
  // The Natural Earth projection.
  PROJECTION_TYPE_NATURAL_EARTH1 = 3;
  // The Robinson projection.
  PROJECTION_TYPE_ROBINSON = 4;
  // The Mollweide projection.
  PROJECTION_TYPE_MOLLWEIDE = 5;
  // The Eckert IV projection.
  PROJECTION_TYPE_ECKERT4 = 6;
  // The Winkel tripel projection.
  PROJECTION_TYPE_WINKEL_TRIPEL = 7;
  // The Aitoff projection.
  PROJECTION_TYPE_AITOFF = 8;
  // The sinusoidal projection.
  PROJECTION_TYPE_SINUSOIDAL = 9;
  // The equirectangular projection.
  PROJECTION_TYPE_EQUIRECTANGULAR = 10;
  // The Mercator projection.
  PROJECTION_TYPE_MERCATOR = 11;
  // The transverse Mercator projection.
  PROJECTION_TYPE_TRANSVERSE_MERCATOR = 12;
  // The Miller projection.
  PROJECTION_TYPE_MILLER = 13;
  // The orthographic projection, which shows the near hemisphere as a globe.
  PROJECTION_TYPE_ORTHOGRAPHIC = 14;
  // The stereographic projection.
  PROJECTION_TYPE_STEREOGRAPHIC = 15;
  // The gnomonic projection.
  PROJECTION_TYPE_GNOMONIC = 16;
  // The azimuthal equal-area projection.
  PROJECTION_TYPE_AZIMUTHAL_EQUAL_AREA = 17;
  // The azimuthal equidistant projection.
  PROJECTION_TYPE_AZIMUTHAL_EQUIDISTANT = 18;
  // The conformal conic projection, which is true to scale along its standard parallels.
  PROJECTION_TYPE_CONIC_CONFORMAL = 19;
  // The equal-area conic projection, which is true to scale along its standard parallels.
  PROJECTION_TYPE_CONIC_EQUAL_AREA = 20;
  // The equidistant conic projection, which is true to scale along its standard parallels.
  PROJECTION_TYPE_CONIC_EQUIDISTANT = 21;
  // A cylindrical equal-area projection, which is true to scale along its standard parallel.
  PROJECTION_TYPE_CYLINDRICAL_EQUAL_AREA = 22;
  // A Hammer projection.
  PROJECTION_TYPE_HAMMER = 23;
}

// A projection that an app adds to its renderer. A renderer without a projection of the name
// reports an error that names it.
message CustomProjection {
  // The name of the projection.
  string name = 1 [(avenger.chart.v1.required) = true, (avenger.chart.v1.lift) = true];
  // The options of the projection, by name. The projection checks their names and their values.
  map<string, OptionValue> options = 2;
}

message PlotData {}

message WholeSphere {}

// A box of longitudes and latitudes.
message FitBox {
  // The western, southern, eastern, and northern edges of the box, in degrees east and north, as
  // the bounding box of GeoJSON orders them. The box crosses the antimeridian when its east is less
  // than its west.
  repeated double bounds = 1 [(avenger.chart.v1.required) = true, (avenger.chart.v1.lift) = true];
}

message SphericalClip {
  oneof clip {
    option (avenger.chart.v1.lift_oneof) = true;
    // A cut at the antimeridian.
    Antimeridian antimeridian = 1;
    // The cap within this many degrees of the center of the view, strictly between 0 and 180.
    double circle_angle = 2;
    // The inside of a spherical polygon.
    RegionClip region = 3;
  }
}

message Antimeridian {}

message RegionClip {
  // A MultiPolygon in longitude and latitude degrees, as WKB. Its edges are great circles, its
  // rings follow the winding of RFC 7946, and its polygons have no holes.
  bytes polygon = 1;
  // Whether the region turns with the rotation of the sphere.
  RegionFrame frame = 2;
}

enum RegionFrame {
  // As for `REGION_FRAME_EARTH`.
  REGION_FRAME_UNSPECIFIED = 0;
  // The region turns with the rotation, so it stays on the same places, as a region that keeps
  // a continent does.
  REGION_FRAME_EARTH = 1;
  // The region stays in the same part of the plot as the sphere turns, as a band of latitudes
  // does.
  REGION_FRAME_VIEW = 2;
}

// The meridians and parallels of a geo plot. Their labels sit on the outline of the projection, or
// on the edges of the plot for a plot that fits a box. A field that is unset takes its value from
// the styles or its default.
message Graticule {
  // Whether the plot draws the graticule. When unset, it does, so `true` draws a graticule with
  // its defaults, and `false` draws none.
  optional bool display = 1 [(avenger.chart.v1.lift) = true];
  // The degrees between meridians and between parallels, as two numbers. When unset, 10 and 10.
  repeated double step = 2;
  // The box that the lines cover, as its western, southern, eastern, and northern edges in degrees.
  // When unset, longitudes from -180 to 180 and latitudes from -80 to 80, as in d3-geo.
  repeated double extent = 3;
  // The degrees between major meridians and between major parallels, as two numbers. The major
  // lines run past `extent` to the box of `extent_major`. When unset, 90 and 360, so the major
  // lines are the meridians alone.
  repeated double step_major = 4;
  // The box that the major lines cover, as its western, southern, eastern, and northern edges in
  // degrees. When unset, longitudes from -180 to 180 and latitudes from -90 to 90.
  repeated double extent_major = 5;
  // The step between the points of each line, in degrees, which the projection resamples. When
  // unset, 2.5.
  optional double precision = 6;
  // The labels of the lines, which take `margin`, `frame`, and `sides`, and no `markup`.
  Labels labels = 7;
  // The CSS color of the lines.
  string grid_stroke = 8;
  // The width of the lines, in pixels.
  optional float grid_stroke_width = 9;
}

// Raster tiles in Web Mercator, which the renderer loads by URL through the image resolver of its
// host and draws on the projection, clipped to its outline. The attribution of the plot credits
// the tile source.
message TileLayer {
  // The URL of each tile, with `{z}`, `{x}`, and `{y}` for its zoom, column, and row, such as
  // `https://tile.openstreetmap.org/{z}/{x}/{y}.png`.
  string url_template = 1 [(avenger.chart.v1.required) = true, (avenger.chart.v1.lift) = true];
  // The lowest zoom that the server has. When unset, 0.
  optional uint32 min_zoom = 2;
  // The highest zoom that the server has. When unset, 19.
  optional uint32 max_zoom = 3;
  // The size of each tile, in pixels. When unset, 256.
  optional uint32 tile_size = 4;
}
