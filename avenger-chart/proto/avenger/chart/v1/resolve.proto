// The sharing rules of plots, concats, and wraps.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/channel.proto";

// The sharing of one channel among the layers of a plot, or among the children of a concat or a
// wrap. An inner independent rule wins over an outer shared rule.
message Resolve {
  // A channel that can take a scale: not `x2`, `y2`, `theta2`, and `radius2`, which follow `x`,
  // `y`, `theta`, and `radius`, and not `longitude`, `latitude`, `longitude2`, `latitude2`,
  // `geometry`, `text`, `image`, `path`, and `detail`.
  Channel channel = 1;
  // Whether the channel's scale is shared. A rule always sets it.
  Sharing sharing = 2;
}

enum Sharing {
  // Not valid.
  SHARING_UNSPECIFIED = 0;
  // One scale for every layer below the node.
  SHARING_SHARED = 1;
  // One scale for each layer of a plot, or for each child of a concat or a wrap. Layers whose
  // specs name one family still share one scale.
  SHARING_INDEPENDENT = 2;
}
