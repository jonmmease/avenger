// The sharing rules of overlays and concats.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/channel.proto";

// The sharing of one channel among the children of an overlay or a concat. An inner independent
// rule wins over an outer shared rule.
message Resolve {
  // A channel that can take a scale: not `x2` and `y2`, which follow `x` and `y`, and not
  // `longitude`, `latitude`, `longitude2`, `latitude2`, `geometry`, `text`, `image`, `path`, and
  // `detail`.
  Channel channel = 1;
  Sharing sharing = 2;
}

enum Sharing {
  SHARING_UNSPECIFIED = 0;
  // One scale for every unit below the node.
  SHARING_SHARED = 1;
  // One scale for each child.
  SHARING_INDEPENDENT = 2;
}
