// The sharing rules of plots, concats, and wraps.

syntax = "proto3";

package avenger.chart.v1;

// The sharing rules of a plot, a concat, or a wrap: the sharing of each channel with a scale of
// its own, of the projections of geo plots, and of the copies of widgets, among the layers of a
// plot or among the children of a concat or a wrap. A sharing that is unset takes the default of
// its node. An inner independent rule wins over an outer shared rule.
//
// The fields of the channels are the channels with a scale of its own, those whose `channel_scale`
// is `CHANNEL_SCALE_OWN`, each named after the channel's field in a mark and numbered with the
// channel's value, which the build of avenger-chart checks.
message Resolve {
  // The sharing of the scale of `x`. The second channel of a pair, such as `x2`, follows the
  // scale of the first.
  Sharing x = 1;
  // The sharing of the scale of `y`.
  Sharing y = 2;
  // The sharing of the scale of `theta`.
  Sharing theta = 5;
  // The sharing of the scale of `radius`.
  Sharing radius = 6;
  // The sharing of the scale of `color`.
  Sharing color = 17;
  // The sharing of the scale of `fill`.
  Sharing fill = 18;
  // The sharing of the scale of `stroke`.
  Sharing stroke = 19;
  // The sharing of the scale of `opacity`.
  Sharing opacity = 20;
  // The sharing of the scale of `fill_opacity`.
  Sharing fill_opacity = 21;
  // The sharing of the scale of `stroke_opacity`.
  Sharing stroke_opacity = 22;
  // The sharing of the scale of `stroke_width`.
  Sharing stroke_width = 23;
  // The sharing of the scale of `stroke_dash`.
  Sharing stroke_dash = 24;
  // The sharing of the scale of `size`.
  Sharing size = 25;
  // The sharing of the scale of `shape`.
  Sharing shape = 26;
  // The sharing of the scale of `angle`.
  Sharing angle = 27;
  // The sharing of the scale of `pattern`.
  Sharing pattern = 28;
  // The sharing of the projections of the geo plots below a concat or a wrap, among its children.
  // Unset on a plot, whose layers share one projection.
  Sharing projection = 40;
  // The keys of the widgets whose copies are independent below the node, so each layer of a plot,
  // or each child of a concat or a wrap, keeps its own widget, as `Widget` describes. The copies of
  // every other key are shared, on plots, concats, and wraps, with or without a facet. Each key is
  // not empty and appears once.
  repeated string independent_widgets = 41;
}

enum Sharing {
  // Unset, so the default of the node applies.
  SHARING_UNSPECIFIED = 0;
  // One scale, or one projection, for every layer below the node.
  SHARING_SHARED = 1;
  // One scale, or one projection, for each layer of a plot, or for each child of a concat or a
  // wrap. Layers whose specs name one family still share one scale.
  SHARING_INDEPENDENT = 2;
}
