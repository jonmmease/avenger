// The values of the named options of custom scales and custom projections.

syntax = "proto3";

package avenger.chart.v1;

// The value of an option: a Boolean, a number, an integer, a string, or a list of numbers or of
// strings.
message OptionValue {
  // The value: a Boolean, a number, an integer, a string, or a list of numbers or of strings.
  oneof value {
    bool boolean = 1;
    double float = 2;
    int64 integer = 3;
    string string = 4;
    FloatList floats = 5;
    StringList strings = 6;
  }
}

// A list of numbers.
message FloatList {
  // The numbers.
  repeated double values = 1;
}

// A list of strings.
message StringList {
  // The strings.
  repeated string values = 1;
}
