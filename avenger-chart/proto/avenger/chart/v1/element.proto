// The elements that plots, axes, legends, facets, and widgets share: titles, labels,
// ticks, and grid lines. Each field means the same in every message that has the element.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/annotation.proto";
import "avenger/chart/v1/style.proto";
import "avenger/chart/v1/value.proto";

// The title of a plot, a concat, a wrap, an axis, a legend, a facet, or a widget. A style
// field that is unset takes its value from the styles. The title of a node, which is a plot, a
// concat, or a wrap, stands on one side of the node with an optional subtitle after it. It runs
// along the whole side of the node's box, over the slabs of its axes and legends, and a title at
// the bottom serves as a caption. The settings that place the title of a node and give its subtitle,
// `side`, `align`, `subtitle`, and `subtitle_style`, are invalid on the title of another
// element, which stands where its axis, legend, facet, or widget puts it.
message Title {
  // The text, in the syntax of `syntax`.
  string text = 1 [(avenger.chart.v1.required) = true];
  // When unset, the styles give it.
  TitleSide side = 2;
  // How the text engine reads the text and the subtitle. When unset, it reads them as Typst
  // markup, because a title is the producer's text, so `*Revenue* in $"USD"$` draws bold text and
  // math. A title of text that is not markup, such as one from an untrusted source, sets
  // `TEXT_SYNTAX_PLAIN`. A title that a part takes from the data, such as the titles of an axis's
  // encodings or the name of a facet's column, has no `Title` and reads as plain text.
  TextSyntax syntax = 3;
  // The style of the text.
  TextStyle style = 4;
  // A line of text after the text, such as the units or the period of the data, or empty for no
  // subtitle.
  string subtitle = 5;
  // The style of the subtitle.
  TextStyle subtitle_style = 6;
  // Where the title stands along its side. When unset, the styles give it.
  TitleAlign align = 7;
}

enum TitleSide {
  // Unset, so the styles give the side.
  TITLE_SIDE_UNSPECIFIED = 0;
  TITLE_SIDE_TOP = 1;
  TITLE_SIDE_LEFT = 2;
  TITLE_SIDE_RIGHT = 3;
  TITLE_SIDE_BOTTOM = 4;
}

// A place along a side, in the direction that the title reads: from the left of a title at the
// top or the bottom, up a title on the left, and down a title on the right.
enum TitleAlign {
  // Unset, so the styles give the alignment.
  TITLE_ALIGN_UNSPECIFIED = 0;
  TITLE_ALIGN_START = 1;
  TITLE_ALIGN_CENTER = 2;
  TITLE_ALIGN_END = 3;
}

// The labels of the ticks of an axis, the entries of a legend, the values of a facet, or the values
// of the fields of a tooltip. A style field that is unset takes its value from the styles.
message Labels {
  // The pattern of numeric and temporal values, such as `,.0f`. A pattern of numbers is in the
  // syntax of `Chart.number_format_syntax`, and a pattern of dates or datetimes is in the syntax of
  // `Chart.datetime_format_syntax`. An empty pattern takes the default of the text engine's
  // formatter, which needs no syntax. Other values, such as strings, show as text.
  string format = 1;
  // Typst markup for each label, as `TEXT_SYNTAX_TYPST` reads it, where `#value` is the formatted
  // value, such as `#value m/s`. An empty markup shows the formatted value as plain text. The
  // label of a category of a band, a point, or an ordinal scale also binds `null`, whether it is
  // the NULL category, whose `value` is `null`, such as `#if null [Unknown] else [#value]`. The
  // label of a column of lumps also binds `other`, whether it is the Other group, `count`, its
  // number of categories, and `weight`, its weight, such as
  // `#if other [#value (#count)] else [#value]`. `count` and `weight` are `?` when the rows that
  // the label stands for disagree.
  string markup = 2;
  // The style of the labels.
  TextStyle style = 3;
}

// The ticks of an axis. A style field that is unset takes its value from the styles.
message Ticks {
  // Where the ticks stand. When unset, at the ticks of the scale, with a count that the axis fits
  // to its length. On the axis of a band or a point scale, only `values` is valid, and on the axis
  // of a nested band scale, which ticks at the bands of its leaf, none is.
  oneof placement {
    // About how many ticks of the scale to draw.
    double count = 1;
    // Ticks at a start and fixed steps, in place of the ticks of the scale.
    TickInterval interval = 2;
    // A list of these ticks in the type of the scale's domain, in place of the ticks of the scale:
    // numbers, dates, or timestamps, or categories of a band or point scale, which the axis labels
    // in its order.
    ValueRef values = 3;
  }
  // The length of each tick, in pixels.
  optional float length = 4;
  // A CSS color.
  string color = 5;
}

// The grid lines of a plot at the ticks of an axis. A style field that is unset takes its value
// from the styles.
message Grid {
  // A CSS color.
  string color = 2;
  // The width of each grid line, in pixels.
  optional float width = 3;
}

// Ticks at a start and each whole multiple of a step before and after it.
message TickInterval {
  oneof spacing {
    option (avenger.chart.v1.required_oneof) = true;
    NumericTicks numeric = 1;
    CalendarTicks calendar = 2;
  }
}

// Ticks of a numeric scale: a first tick and the step between two ticks.
message NumericTicks {
  // A tick, which the other ticks step from.
  double start = 1;
  // The distance between two ticks, more than 0.
  double step = 2;
}

// Ticks of a time scale. Months and days step in the civil time of the scale.
message CalendarTicks {
  // The first tick, in milliseconds since the Unix epoch.
  int64 start = 1;
  // The number of units between two ticks, more than 0.
  int64 count = 2;
  // The unit of the step between two ticks.
  CalendarUnit unit = 3 [(avenger.chart.v1.required) = true];
}

// The unit of the step of calendar ticks.
enum CalendarUnit {
  // No unit: calendar ticks have one.
  CALENDAR_UNIT_UNSPECIFIED = 0;
  // A month of the civil time of the scale.
  CALENDAR_UNIT_MONTH = 1;
  // A day of the civil time of the scale.
  CALENDAR_UNIT_DAY = 2;
  // A millisecond.
  CALENDAR_UNIT_MILLISECOND = 3;
}
