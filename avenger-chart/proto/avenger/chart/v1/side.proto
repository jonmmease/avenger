// The sides of a plot, which the axes, legends, titles, attributions, and widgets of several
// coordinate systems use.

syntax = "proto3";

package avenger.chart.v1;

// A side of a plot, for an axis, a legend, an attribution, a widget, or graticule labels, a side of
// a node, for its title, or a side of the children of a facet, for its title and labels.
enum Side {
  // Unset, so the styles give the side, where its field is a style field, and otherwise not valid.
  SIDE_UNSPECIFIED = 0;
  SIDE_BOTTOM = 1;
  SIDE_TOP = 2;
  SIDE_LEFT = 3;
  SIDE_RIGHT = 4;
}
