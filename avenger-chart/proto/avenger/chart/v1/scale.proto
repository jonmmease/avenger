// The scale specs of encoded channels.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/channel.proto";
import "avenger/chart/v1/guide.proto";
import "avenger/chart/v1/option.proto";

// The scale of a channel. The chart stores the spec, and the renderer builds the configured scale
// from the spec, the theme, and a fit to the domain's summaries at the size of each plot.
//
// The specs of the units that share a scale must agree: the type, the range, and the fit must be
// equal, and each option that two specs both set must be equal. An option that one spec sets and
// another does not takes the set value. The guide follows the rule of the options: a guide that
// one spec sets and another does not is the guide of both, two guides must be of one kind, and
// each field that both set, in the guide and in its nested messages, must be equal. Every guide
// of the shared scale draws the merged guide. Summary and data domains merge. Explicit domains
// must be equal, selection domains must be equal, and a unit with an explicit or a selection
// domain shares a scale only with units whose domain is equal to it.
message ScaleSpec {
  // The typetag name of an avenger-scales `ScaleImpl`, such as `linear`, `log`, `time`, `band`,
  // `point`, or `ordinal`.
  string type = 1;
  // The `ScaleConfig.options` of avenger-scales, which the `option_definitions` of the scale type
  // check, such as `clamp` or `padding_inner`, in the order of their names, with each name at
  // most once. The renderer gives each value to the scale as an avenger-scales `Scalar` of one
  // Arrow value: a `Boolean`, a `Float64`, an `Int64`, a `Utf8`, or a list of `Float64` or of
  // `Utf8` values, and a scale reads a number of either type as a float or an integer. The
  // `clip_padding_lower` and `clip_padding_upper` of a band or point scale are minimums, which
  // the fit raises to keep the marks inside the range.
  repeated NamedOption options = 2;
  // Where the domain comes from. A spec always sets it.
  Domain domain = 3;
  // The range. When it is not set, the theme gives the range of a non-position channel, and the
  // plot gives the range of a position channel, which can set only `reverse`.
  Range range = 4;
  // The share family. Units whose specs name one family for a channel share one scale, in
  // addition to the scales that resolve rules share.
  string family = 5;
  // The guide. When it is not set, a position channel has an axis, a discrete scale of another
  // channel has a legend, and a continuous color scale has a colorbar.
  Guide guide = 6;
  // How a summary or data domain fits: the `DomainOptions` of avenger-scales. It is set exactly
  // when the domain, or the fallback of a selection domain, is a summary or a data domain of a
  // scale whose kind has options: `interval` for linear, log, pow, symlog, time, and quantize
  // scales, and `categories` for band, point, nested band, and ordinal scales. A quantile scale,
  // an explicit domain, and a selection domain with an explicit fallback have no fit.
  DomainFit fit = 7;
}

// Where a scale's domain comes from.
message Domain {
  oneof domain {
    // The domain, as an IPC stream of one column, which becomes the `ScaleConfig.domain` of the
    // scale. The column holds:
    //
    // - for linear, log, pow, symlog, and quantize scales: the two ends, in ascending order
    // - for a time scale: the two ends as dates or timestamps, in ascending order, whose type is
    //   the type of the domain
    // - for band, point, and ordinal scales: the categories, in their order
    // - for a nested band scale: the paths as a struct column with one field for each level
    // - for a threshold scale: the thresholds, in ascending order
    // - for a quantile scale: the sample of values that the quantiles divide
    //
    // `Range.reverse` reverses a scale. An interval scale keeps the domain at every size, and the
    // plot clips its marks, because the domain can exclude data. A band or point scale fits its
    // clip padding from the reach of the marks that the unit's rows draw.
    bytes explicit = 1;
    // This unit's summary of its data, as an IPC stream of one column and one row that holds the
    // struct of `DomainSummary::to_arrow`, as the `{type}_summary` aggregate of avenger-scales
    // returns it. The producer makes it with the scale type and the options of the spec, over all
    // of the data that the domain covers, which can be more than the rows of the unit's table,
    // and with the reach of the marks that it computed. The renderer merges it as it is.
    //
    // The reach holds for the non-position scales and the theme that the producer used, such as
    // the size scale of symbols. When a combination shares a non-position scale that the reach
    // depends on, the shared scale can differ from the producer's, and the unit's marks can reach
    // past the edges of its plot. The renderer then reports that the marks do not fit.
    bytes summary = 2;
    // The renderer summarizes this unit's own data: the column of this channel and of its pair,
    // `x2` for `x` and `y2` for `y`, or its scaled constant, with the reach of each mark that the
    // rows draw. The domain then covers only the rows of the unit's table.
    DataDomain data = 3;
    // The values of a selection for one channel, such as the brush of an overview chart for the
    // `x` of its detail chart. The domain is the envelope of the ranges, or the union of the sets
    // in the order of their contributions and tuples, of a global or a union selection, and their
    // intersection for an intersect selection. A selection without values for the channel, or an
    // empty intersection, gives the fallback. The plot clips its marks, as for an explicit domain.
    SelectionDomain selection = 4;
  }
}

message DataDomain {}

// A domain from the values of a selection.
message SelectionDomain {
  // The name of the selection.
  string selection = 1;
  // The channel whose fields give the domain: the sets and ranges of the tuples that projected
  // through this channel.
  Channel channel = 2;
  // The domain when the selection gives no values: an explicit, a summary, or a data domain.
  Domain fallback = 3;
}

// The `DomainOptions` of avenger-scales.
message DomainFit {
  oneof fit {
    IntervalFit interval = 1;
    CategoryFit categories = 2;
  }
}

// The `IntervalOptions` of avenger-scales.
message IntervalFit {
  // Whether the domain contains zero.
  bool zero = 1;
  // The tick count of a nice domain, whose ends are round values. When it is not set, the domain
  // is not nice. A log scale's nice domain ends on powers of its base, whatever the count.
  optional double nice = 2;
  // The domain when there is no data, as an explicit domain holds it, or empty bytes for the
  // default of the scale type.
  bytes empty = 3;
}

// The `CategoryOptions` of avenger-scales: the order of the categories of a summary or data
// domain. The data decides which categories the domain holds. An explicit domain gives exactly
// its categories in its order instead.
message CategoryFit {
  oneof order {
    // The categories of the data, ascending or descending. Nested paths sort level by level, so
    // each level sorts within its parent.
    CategorySort sort = 1;
    // These categories first, in this order, as an IPC stream of one column, and then the other
    // categories of the data, ascending. Listed categories without data are not in the domain.
    // A nested band scale does not take a preferred order.
    bytes preferred = 2;
  }
}

enum CategorySort {
  CATEGORY_SORT_UNSPECIFIED = 0;
  CATEGORY_SORT_ASCENDING = 1;
  CATEGORY_SORT_DESCENDING = 2;
}

message Range {
  oneof range {
    // The values of the range as an IPC stream of one column, such as CSS colors, sizes, or
    // shape names.
    bytes values = 1;
    // The name of a palette of the theme, such as `tableau10`.
    string palette = 2;
  }
  // Whether the range runs from its end to its start: the values or the palette in reverse, or
  // the plot's range of a position channel from its far end.
  bool reverse = 3;
}
