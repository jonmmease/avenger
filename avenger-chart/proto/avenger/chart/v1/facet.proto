// The facets of concats and wraps, and the headers that label their children.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/side.proto";
import "avenger/chart/v1/style.proto";

// The facet of a concat or a wrap: the partition column that its children split, and the header
// that labels each child with its value. Every child declares a value of the column in its
// partition, an empty child too, and the values have one Arrow type. The header takes the values
// in the order of the children, so the order of the children is the order of the values.
//
// A concat or a wrap with a facet shares every channel and the projection by default, because the
// panels of a facet grid show one chart over parts of one table. Its resolve rules can still make a
// channel independent, such as `y` for each row of a facet grid.
message Facet {
  // The partition column of the children.
  string column = 1;
  // When neither is set, the facet has a header with the default options.
  oneof header {
    FacetHeader shown = 2;
    NoHeader hidden = 3;
  }
}

// The header of a facet: a label for each child with its value, a rule from the center of the
// first child to the center of the last with a tick toward each label, and the title beyond them,
// as the facet guide of avenger-guides draws them. In a concat, one header runs along the
// children, and a header with one value has no rule. In a wrap, whose rows change with its width,
// each child has a header with its own value, and the titles merge into one on the wrap by
// default. The headers of one column below one concat match the thickness of their labels, so
// their titles line up whether or not a header has a rule. A style field that is not set takes
// the value of the theme.
message FacetHeader {
  // The title, or empty for no title. The builder stores the facet's column as the title when the
  // caller gives none.
  string title = 1;
  TextSyntax title_syntax = 2;
  TextStyle title_style = 3;
  // The side of the children. A concat in a row takes the top or the bottom, a concat in a column
  // takes the left or the right, and a wrap takes any side of each child. When it is not set, a
  // row and a wrap have the header at the top, and a column at the right.
  Side side = 4;
  // The pattern of numeric and temporal values, in the syntax of the number or datetime formatter
  // of the text engine, as for `Axis.format`. Other values, such as strings, show as text.
  string format = 5;
  // Typst markup for each label, where `#value` is the formatted value, such as `Grade #value`.
  // An empty label shows the formatted value as plain text.
  string label = 6;
  // The angle of the labels, in degrees clockwise. When it is not set, the labels read along the
  // header: level above or below the children, up beside a left header, and down beside a right
  // one.
  optional float label_angle = 7;
  TextStyle label_style = 8;
  // The space between the labels and what lies inward of them: the edge of the children, or the
  // header of a facet inside this one, in pixels. When it is not set, the theme gives it, with more
  // space beyond an inner header, so the levels of a nested facet read apart.
  optional float label_padding = 9;
  // The length of each tick, in pixels.
  optional float tick_length = 10;
  // The CSS color of the rule and the ticks.
  string rule_color = 11;
  // The width of the rule and the ticks, in pixels.
  optional float rule_width = 12;
}

message NoHeader {}
