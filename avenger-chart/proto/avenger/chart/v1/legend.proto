// The legends of non-position scales: symbol and line legends of discrete scales, and colorbars
// of continuous color scales.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/guide_element.proto";
import "avenger/chart/v1/side.proto";
import "avenger/chart/v1/style.proto";
import "avenger/chart/v1/value.proto";

// A legend: an entry for each category of a discrete scale, for each bin of a quantize, quantile,
// or threshold scale, labeled with the range of the bin, or for each tick of another continuous
// scale, such as the sizes of a size scale, with a swatch of the mark and a label. A style field
// that is absent takes its value from the styles.
//
// The legends of discrete scales with one owner merge into one legend when the scales hold the
// same categories in the same order and the legends are equal, so the `color` and the `shape` of
// one column show one legend, whose swatches take the value of each scale. A legend of a
// continuous scale does not merge.
message Legend {
  // The title. When its text is absent, the legend takes the titles of the encodings of its scale,
  // as `Encoding.title` describes.
  GuideTitle title = 1;
  // The labels of the entries, where `#value` is the formatted entry, or the formatted range of
  // a bin.
  GuideLabels labels = 2;
  // The side of the plot that the legend stands on. When absent, the styles give it.
  Side side = 3;
  // How the entries fill the lines along the side.
  LegendWrap wrap = 4;
  // The space between a swatch and its label, in pixels.
  optional float label_padding = 5;
  // The space between columns of entries, in pixels.
  optional float column_gap = 6;
  // The space between rows of entries, in pixels.
  optional float row_gap = 7;
  // The box behind the legend. When absent, the legend has no background.
  Background background = 8;
  // The entries of the legend of a continuous scale. When absent, at the ticks of the scale, with a
  // count that the styles give.
  oneof entries {
    // About how many ticks of the scale the legend shows.
    double tick_count = 9;
    // A list of the entries, in the type of the scale's domain, in place of the ticks of the scale.
    ValueRef values = 10;
  }
  // The class names of the legend, which a stylesheet selects with `.name`, as the HTML `class`
  // attribute lists them. Each is not empty and holds no whitespace.
  repeated string classes = 11;
  // An id, or empty, which a stylesheet selects with `#id`, with CSS escapes for an id that is
  // not a CSS identifier. With its partition, it identifies the legend, as `Node` describes.
  string id = 12;
}

message LegendWrap {
  oneof wrap {
    // Each entry at its own size, with a line breaking before an entry that would pass the length
    // of the side.
    LegendFlow flow = 1;
    // Equal cells, as wide as the widest entry and as tall as the tallest, filled along the side
    // first.
    LegendGrid grid = 2;
  }
}

message LegendFlow {}

message LegendGrid {
  // The count of columns at every length. When absent, the legend takes as many cells along the
  // side as fit.
  optional uint32 columns = 1;
}

// A colorbar of a continuous color scale: a gradient of the colors of the scale, with an axis
// beside it. A style field that is absent takes its value from the styles.
message Colorbar {
  // The axis of the colorbar.
  ColorbarAxis axis = 1;
  // The thickness of the gradient, across the colorbar, in pixels.
  optional float thickness = 2;
  // The space between the gradient and its axis, in pixels.
  optional float axis_gap = 3;
  // The box behind the colorbar. When absent, the colorbar has no background.
  Background background = 4;
  // The longest that the colorbar runs along its side, with its background, in pixels. When absent,
  // it runs the whole length that the layout gives it.
  optional float max_length = 5;
  // The class names of the colorbar, which a stylesheet selects with `.name`, as the HTML `class`
  // attribute lists them. Each is not empty and holds no whitespace.
  repeated string classes = 6;
  // An id, or empty, which a stylesheet selects with `#id`, with CSS escapes for an id that is
  // not a CSS identifier. With its partition, it identifies the colorbar, as `Node` describes.
  string id = 7;
}

// The axis beside the gradient of a colorbar: its title, its line, its ticks, and their labels, as
// for `Axis`, without grid lines. A style field that is absent takes its value from the styles.
message ColorbarAxis {
  // The title of the colorbar. When its text is absent, the colorbar takes the titles of the
  // encodings of its scale, as `Encoding.title` describes.
  GuideTitle title = 1;
  // The side of the plot that the colorbar stands on. When absent, the styles give it.
  Side side = 2;
  GuideLabels labels = 3;
  // Whether the axis shows its labels. When absent, it shows them.
  optional bool show_labels = 4;
  // The angle of the labels, in degrees clockwise.
  optional float label_angle = 5;
  // When absent, each label aligns to its end nearest its tick, for the side of the colorbar and
  // the angle of the labels.
  TextAlign label_align = 6;
  // When absent, each label aligns to its end nearest its tick, as for `label_align`.
  TextBaseline label_baseline = 7;
  GuideTicks ticks = 8;
  // The CSS color of the line along the axis.
  string domain_color = 9;
}
