// The selections of a chart: their definitions, the clauses that plots write to them, and the
// predicates that conditional values check.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/channel.proto";
import "avenger/chart/v1/partition.proto";
import "avenger/chart/v1/value.proto";

// A named selection. The tools of plots and layers write its clauses, the conditional values of
// encodings style rows by it, and a selection domain reads its values. A query that filters data
// by a selection reads the same clauses with the same rules.
message Selection {
  // The name. Two selections with one name join, as `Chart.selections` describes.
  string name = 1;
  // A selection always sets it.
  SelectionResolution resolution = 2;
  // The clauses before any gesture, keyed by owner, which are the clauses of the selection until a
  // gesture writes others. A reader orders them by the tree order of their owners.
  repeated Clause initial = 3;
}

// How the clauses of a selection replace each other and combine.
enum SelectionResolution {
  // Not valid.
  SELECTION_RESOLUTION_UNSPECIFIED = 0;
  // A new clause replaces every other clause, so the chart has one brush.
  SELECTION_RESOLUTION_GLOBAL = 1;
  // A new clause replaces the clause of its owner, so each plot keeps its own brush. A row
  // matches when it matches any clause.
  SELECTION_RESOLUTION_UNION = 2;
  // A new clause replaces the clause of its owner. A row matches when it matches the clause of
  // every owner that has one, so a plot without a brush does not empty the selection.
  SELECTION_RESOLUTION_INTERSECT = 3;
}

// The part of a selection that one plot wrote: conditions that a row matches when it matches all
// of them.
message Clause {
  // The id of the plot or the layer that declares the tool that wrote the clause. With
  // `partition`, it names the owner, as `Node` describes.
  string owner = 1;
  // The conditions, at least one. A row matches the clause when it matches every condition, so
  // a box of `x` and `y` is two ranges, and the clicked bars of a grouped chart are one set of
  // two columns.
  repeated Condition conditions = 2;
  // The partition of the owner, as `PartitionValue` describes, keyed by column. The plots of the
  // facets of one table can share an id, so the partition tells their clauses apart.
  repeated PartitionValue partition = 3;
}

// A check of one or more columns of a row. A null value matches no condition. A partition column of
// a layer holds the partition value in every row. When neither the table nor the partition of a
// layer has a column of the condition, no row of the layer matches, and the render reports a
// warning that names the selection and the column.
message Condition {
  oneof kind {
    ValueSet set = 1;
    ValueRange range = 2;
    Polygon polygon = 3;
    CyclicRange cyclic_range = 4;
  }
}

// A set of tuples of values of one or more columns, as a point selection records the keys of the
// instances that it selects. A row matches when its values of the columns equal one tuple, so a
// set of `carrier` and `dest` with the tuples (UA, ATL) and (AA, BOS) does not match a row of UA
// and BOS.
message ValueSet {
  // The columns, at least one.
  repeated SetColumn columns = 1;
}

// A column of a set and its values.
message SetColumn {
  // The name of the column.
  string column = 1;
  // The channel that the selection projected through, or `CHANNEL_UNSPECIFIED` for a column that
  // the selection names directly.
  Channel channel = 2;
  // A list of the values of the column, in the type of the column. The lists of the columns of a
  // set have one length, and the tuples of the set are their rows.
  ValueRef values = 3;
}

// A range of values, as an interval on a continuous scale or a click on a bin records it. A row
// matches when its value is between the ends.
message ValueRange {
  // The name of the column.
  string column = 1;
  // The channel that the selection projected through, or `CHANNEL_UNSPECIFIED` for a column that
  // the selection names directly.
  Channel channel = 2;
  // The low end, in the type of the column.
  ValueRef low = 3;
  // The high end, in the type of the column, at or above `low`.
  ValueRef high = 4;
  // Whether the range excludes its high end, as the range of a bin does. Otherwise it includes
  // both ends.
  bool exclude_end = 5;
}

// Polygons in the coordinates of two columns, as lassos record them. A row matches when the point
// of its two values is inside one of the polygons, each by the even-odd rule, so the overlap of
// two lassos is inside. The edges are straight in those coordinates, which are longitudes and
// latitudes for a lasso on a map plot.
message Polygon {
  // The column of the horizontal values of the points.
  string x_column = 1;
  // The column of the vertical values of the points.
  string y_column = 2;
  // The polygons, at least one: each a list of the vertices in order around it, each a struct of
  // an `x` field in the type of `x_column` and a `y` field in the type of `y_column`.
  repeated ValueRef vertices = 3;
}

// A range of a dimension that wraps, from `start` forward to `end`, with both ends, where values
// that differ by `period` are the same place: longitudes in degrees, with a period of 360, or the
// values of `theta` around a whole circle, with the width of its domain as the period. When `end`
// is less than `start`, the range crosses the wrap. A range at least `period` wide holds every
// value. A row matches when its value, less `start` and wrapped into one period, is at most the
// width of the range, so the condition needs no origin of the wrap. A box on a map records a cyclic
// range of its longitude column with a `ValueRange` of its latitude column, because latitudes do
// not wrap.
message CyclicRange {
  // The name of the column.
  string column = 1;
  // The channel that the selection projected through: `CHANNEL_LONGITUDE` for a box on a map,
  // `CHANNEL_THETA` for a box in a polar plot, or `CHANNEL_UNSPECIFIED` for a column that the
  // selection names directly.
  Channel channel = 2;
  // Where the range starts, in the values of the column.
  double start = 3;
  // Where the range ends, forward from `start`. When it is less than `start`, the range crosses the
  // wrap.
  double end = 4;
  // The length of one turn, in the values of the column. It is positive.
  double period = 5;
}

// The rows that selections select.
message Predicate {
  oneof predicate {
    Selected selected = 1;
    // Every predicate of the list selects the row, so an empty list selects every row.
    PredicateList all = 2;
    // A predicate of the list selects the row, so an empty list selects none.
    PredicateList any = 3;
    // The predicate does not select the row.
    Predicate negate = 4;
  }
}

message PredicateList {
  // The predicates of the list.
  repeated Predicate predicates = 1;
}

// The rows that a selection selects.
message Selected {
  // The name of the selection.
  string selection = 1;
  // Whether a selection without clauses selects no row. Otherwise it selects every row, so a
  // conditional value that grays out the rows outside a brush grays out nothing before the first
  // brush.
  bool empty_selects_none = 2;
  // Whether the predicate skips the clauses of the plot that it styles: the clauses whose owner is
  // the layer of the row or its plot. A predicate that skips every clause of
  // a selection that has some selects every row.
  bool exclude_own = 3;
}
