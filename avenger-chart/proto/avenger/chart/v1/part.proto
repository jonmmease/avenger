// The parts that stand beside plots, which the rules of a concat keep, collapse, or merge: the
// parts of axes, legends, facets, attributions, and widgets. Axes are in `axis.proto`,
// legends in `legend.proto`, facets in `facet.proto`, and the elements that they share in
// `element.proto`.
//
// The format calls the parts of a scale its axis and its legend, and keeps the name guide for the
// guides of a coordinate system, such as the graticule of a geo plot.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/annotation.proto";

// A part of the axis or the legend of a scale, of a facet, or a widget, which the part rules
// of a concat keep, collapse, or merge.
enum Part {
  // Unset. Every field of this enum is required, so none holds this value.
  PART_UNSPECIFIED = 0;
  // The ticks of an axis.
  PART_AXIS_TICKS = 1;
  // The tick labels of an axis.
  PART_AXIS_LABELS = 2;
  // The title of an axis.
  PART_AXIS_TITLE = 3;
  // A legend, a symbol legend or a colorbar.
  PART_LEGEND = 4;
  // The labels of a facet, with its rule and ticks.
  PART_FACET_LABELS = 5;
  // The title of a facet.
  PART_FACET_TITLE = 6;
  // The attribution of a plot.
  PART_ATTRIBUTION = 7;
  // A widget, as `Widget` describes.
  PART_WIDGET = 8;
}

// The rule of one part among the plots of a concat.
message PartRule {
  // The part that the rule applies to.
  Part part = 1 [(avenger.chart.v1.required) = true];
  // What the concat does with the part.
  PartRuleKind rule = 2 [(avenger.chart.v1.required) = true];
}

enum PartRuleKind {
  // Unset. Every field of this enum is required, so none holds this value.
  PART_RULE_KIND_UNSPECIFIED = 0;
  // One part for each plot.
  PART_RULE_KIND_KEEP = 1;
  // One part for each lane of plots that line up.
  PART_RULE_KIND_COLLAPSE = 2;
  // One part for the concat.
  PART_RULE_KIND_MERGE = 3;
}
