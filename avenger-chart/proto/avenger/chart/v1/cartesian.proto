// The Cartesian coordinate system.

syntax = "proto3";

package avenger.chart.v1;

// Position scales on `x`, `y`, `x2`, and `y2`, for the marks without a prefix.
message Cartesian {
  // The width of the plot over its height, which the plot keeps inside the space that the layout
  // gives it, or with the plot's `width` or `height`, as `Plot.width` describes. When unset, the
  // plot takes all of that space.
  optional float aspect_ratio = 1;
}
