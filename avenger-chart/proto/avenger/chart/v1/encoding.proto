// The channels of a mark and their bindings to columns and constants.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/scale.proto";
import "avenger/chart/v1/selection.proto";
import "avenger/chart/v1/value.proto";

// The binding of a channel to a column or a constant. The field of the mark that holds the
// encoding names its channel.
//
// The marks without a prefix draw in Cartesian plots, the `polar_` marks in polar plots, and the
// `geo_` marks in map plots, and the `mark` oneof of each kind of layer holds the marks of its
// plot. A property of a mark that is absent takes its value from the styles. A property that varies
// with each row or each series is a channel, not a property, so an encoding gives its values: each
// mark message has an `Encoding` field for each channel that it takes, named after the channel, at
// the number 100 plus the channel's value in `Channel`. The comment of a channel's field says what
// the channel means for the mark when the comment of the channel does not.
message Encoding {
  oneof value {
    // The name of a column of the layer's table.
    string column = 2;
    // A value that the mark draws as it is, in the form that the comment of the channel gives, such
    // as a CSS color.
    ValueRef constant = 3;
    // A data value that goes through the scale of the channel, such as the position of a reference
    // line.
    ValueRef scaled_constant = 4;
  }
  // The scale of the channel, which maps the values of each `column` and `scaled_constant` of the
  // encoding and of its conditional values to what the mark draws. An encoding with a
  // `scaled_constant` always has a scale, and an encoding whose values are all `constant` values
  // never has one.
  //
  // `x` and `y` always have a scale, because the axes and the fit of the plot need one. `x2`, `y2`,
  // `theta2`, `radius2`, `longitude`, `latitude`, `longitude2`, `latitude2`, `geometry`, `text`,
  // `image`, `path`, and `detail` never have one: the paired channels go through the scale of `x`,
  // `y`, `theta`, or `radius`, and the others take no scale. A `column` of any other channel
  // without a scale holds values that the mark draws as they are, as it draws a `constant`, in the
  // form that the comment of the channel gives. The channel then has no guide and joins no shared
  // scale.
  ScaleSpec scale = 5;
  // Values for the rows that predicates select, in order. A row takes the value of the first
  // conditional value whose predicate selects it, and the value of the encoding when none does.
  // The position channels of every coordinate system and `detail` have no conditional values. The
  // reach of a row covers every value that the encoding and its conditional values can give it,
  // so a change of a selection does not fit the domains again.
  repeated ConditionalValue conditional = 6;
  // The column that a selection through this channel records, when the encoded column derives from
  // another, such as the bounds of the bins of a histogram. With a paired channel, `x` with `x2`,
  // `y` with `y2`, `theta` with `theta2`, or `radius` with `radius2`, the two columns are the ends
  // of a range of this column: a point selection records `[x, x2)` as a range without its end, and
  // an interval selection records its range. When it is empty, a selection records the encoded
  // column. It is absent on the second channels of the pairs.
  string selection_field = 7;
  // The title of the encoded values in the guide of the channel's scale. When absent, the title of
  // a column is its name, and a constant or a scaled constant has none. An empty title gives the
  // guide no title from this encoding. A guide whose own title is absent takes the distinct titles
  // of the encodings of its scale, in tree order, joined by `, `, so a plot of `count` bars and a
  // `mean` rule titles its shared `y` axis `count, mean`, and it draws no title when they give
  // none. An encoding without a scale has no guide, so it has no title.
  optional string title = 8;
}

// A value of a channel for the rows that a predicate selects.
message ConditionalValue {
  // The predicate that selects the rows that take this value.
  Predicate predicate = 1;
  oneof value {
    // The name of a column of the layer's table.
    string column = 2;
    // A value that the mark draws as it is, as for `Encoding.constant`.
    ValueRef constant = 3;
    // A data value that goes through the scale of the channel, as for
    // `Encoding.scaled_constant`.
    ValueRef scaled_constant = 4;
  }
}
