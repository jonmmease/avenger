// The channels of a mark and their bindings to columns and constants.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/scale.proto";
import "avenger/chart/v1/selection.proto";
import "avenger/chart/v1/value.proto";

// The binding of a channel to a column or a constant. The field of the mark that holds the
// encoding names its channel.
//
// The marks without a prefix draw in Cartesian plots, the `polar_` marks in polar plots, and the
// `geo_` marks in map plots, and the `mark` oneof of each kind of layer holds the marks of its
// plot. A property of a mark that is absent takes its value from the styles. A property that varies
// with each row or each series is a channel, not a property, so an encoding gives its values: each
// mark message has an `Encoding` field for each channel that it takes, named after the channel, at
// the number 100 plus the channel's value in `Channel`. The comment of a channel's field says what
// the channel means for the mark when the comment of the channel does not.
message Encoding {
  // The value of the channel. A `scaled_` value goes through the channel's scale, and a plain value
  // is drawn as it is, in the form that the comment of the channel gives, even in an encoding that
  // has a scale.
  oneof value {
    // The name of a column of the layer's table, whose values the mark draws as they are, such as
    // CSS colors.
    string column = 2;
    // The name of a column of the layer's table, whose values go through the channel's scale.
    string scaled_column = 3;
    // A value that the mark draws as it is, in the form that the comment of the channel gives, such
    // as a CSS color.
    ValueRef constant = 4;
    // A data value that goes through the channel's scale, such as the position of a reference
    // line.
    ValueRef scaled_constant = 5;
  }
  // The scale of the channel, which maps the `scaled_column` and `scaled_constant` values of the
  // encoding and of its conditional values to what the mark draws. An encoding has a scale exactly
  // when its value or one of its conditional values is a `scaled_` value, and a reader requires its
  // type and its domain. Scale inference fills in a scale, a type, or a domain that a producer
  // leaves out.
  //
  // `x` and `y` take `scaled_` values only, because the axes and the fit of the plot need a scale.
  // The second channels of pairs, `x2`, `y2`, `theta2`, and `radius2`, never have a scale of their
  // own: their `scaled_` values go through the scale of `x`, `y`, `theta`, or `radius`, so they are
  // `scaled_` values exactly when the first channel has a scale. `longitude`, `latitude`,
  // `longitude2`, `latitude2`, `geometry`, `text`, `image`, `path`, and `detail` take no scale, so
  // their values are plain. An encoding of any other channel without a scale has no guide and
  // joins no shared scale.
  ScaleSpec scale = 6;
  // Values for the rows that predicates select, in order. A row takes the value of the first
  // conditional value whose predicate selects it, and the value of the encoding when none does.
  // The position channels of every coordinate system and `detail` have no conditional values. The
  // reach of a row covers every value that the encoding and its conditional values can give it,
  // so a change of a selection does not fit the domains again.
  repeated ConditionalValue conditional = 7;
  // The column that a selection through this channel records, when the encoded column derives from
  // another, such as the bounds of the bins of a histogram. With a paired channel, `x` with `x2`,
  // `y` with `y2`, `theta` with `theta2`, or `radius` with `radius2`, the two columns are the ends
  // of a range of this column: a point selection records `[x, x2)` as a range without its end, and
  // an interval selection records its range. When it is empty, a selection records the encoded
  // column. It is absent on the second channels of the pairs.
  string selection_field = 8;
  // The title of the encoded values in the guide of the channel's scale. When absent, the title of
  // a column is its name, and a constant or a scaled constant has none. An empty title gives the
  // guide no title from this encoding. A guide whose own title is absent takes the distinct titles
  // of the encodings of its scale, in tree order, joined by `, `, so a plot of `count` bars and a
  // `mean` rule titles its shared `y` axis `count, mean`, and it draws no title when they give
  // none. An encoding without a scale has no guide, so it has no title.
  optional string title = 9;
  // Where the mark of a position channel stands in its band, from 0 at the start of the band to 1
  // at its end, on a band or a nested band scale. When absent, a point mark, such as a symbol, a
  // text, or the vertex of a line, stands at the middle of its band, and a bar or a rect spans its
  // band, from its start to its end. Valid only on `x`, `y`, `theta`, and `radius` through a band
  // or a nested band scale.
  optional double band_position = 10;
  // The level whose band holds the mark of a position channel on a nested band scale, from 0 for
  // the outermost, such as the band of a group behind the bars of its members. A band at an outer
  // level spans the bands of its members, so the bands of a level differ in width. When absent, the
  // leaf. Valid only on `x`, `y`, `theta`, and `radius` through a nested band scale, below the
  // number of its levels.
  //
  // At an outer level, only the fields of a path up to the level name its band, and the deeper
  // fields are ignored, so a row of a group, such as `{region: "East", channel: null}`, can hold
  // nulls there. The paths of the encoding then add no path to the scale's domain: the groups and
  // their bands come from the scale's other paths, and a row whose group they do not hold has no
  // band and does not draw.
  optional uint32 band_level = 11;
}

// A value of a channel for the rows that a predicate selects.
message ConditionalValue {
  // The predicate that selects the rows that take this value.
  Predicate predicate = 1;
  oneof value {
    // The name of a column whose values the mark draws as they are, as for `Encoding.column`.
    string column = 2;
    // The name of a column whose values go through the channel's scale, as for
    // `Encoding.scaled_column`.
    string scaled_column = 3;
    // A value that the mark draws as it is, as for `Encoding.constant`.
    ValueRef constant = 4;
    // A data value that goes through the channel's scale, as for `Encoding.scaled_constant`.
    ValueRef scaled_constant = 5;
  }
}
