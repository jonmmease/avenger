// The channels of a mark and their bindings to columns and constants.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/annotation.proto";
import "avenger/chart/v1/scale.proto";
import "avenger/chart/v1/selection.proto";
import "avenger/chart/v1/value.proto";

// The binding of a channel to a column or a constant. The field of the mark that holds the
// encoding names its channel.
//
// The marks without a prefix draw in Cartesian plots, the `polar_` marks in polar plots, and the
// `geo_` marks in geo plots, and the `mark` oneof of each kind of layer holds the marks of its
// plot. A property of a mark that is unset takes its value from the styles. A property that varies
// with each row or each series is a channel, not a property, so an encoding gives its values: each
// mark message has an `Encoding` field for each channel that it takes, named after the channel, at
// the number 100 plus the channel's value in `Channel`. The comment of a channel's field says what
// the channel means for the mark when the comment of the channel does not.
message Encoding {
  // What the channel draws: a field, a column of the layer's table, or a value, one constant. A
  // `scaled_` field or value goes through the channel's scale, and a `direct_` one is drawn as it
  // is, in the form that the comment of the channel gives, even in an encoding that has a scale.
  // Each value says which, so one encoding can hold both, such as a scaled field with a
  // conditional direct value that grays the rows outside a brush.
  //
  // A field of a position channel with a partner, `x`, `y`, `theta`, or `radius`, can name a
  // column of spans: structs of a `start` and an `end` field, in that order, of one numeric or
  // temporal type, such as the bins of a histogram, and optionally a third field, a `unit` of text
  // that the chart ignores, such as the units of the `timeunit` transform. The column gives the
  // channel its starts and the partner, `x2`, `y2`, `theta2`, or `radius2`, its ends. The mark
  // takes the partner, and the partner is unset, which the reader fills with the same field, or
  // names the same column.
  //
  // A field of a categorical channel can name a column of lumps, the structs that the `lump`
  // transform writes: exactly a `value`, an `other` of Utf8, a `weight` of Float64, and a
  // `category_count` of Int64, in that order. A row of a kept category has its category in `value`
  // and a NULL `other`, a row of the Other group has a NULL `value` and its label in `other`, and
  // a row of the NULL category has a NULL `value` and a NULL `other`. A NULL lump, a row of a NULL
  // category that the lump drops, is in no category and draws no mark. A lump goes through a band,
  // a point, or an ordinal scale, whose domain is the kept categories, then the Other group, then
  // the NULL category, so they are the last bands, points, axis labels, and legend entries. The
  // explicit domains, preferred categories, and tick and legend values of the scale are kept
  // categories, in the type of `value`, and an explicit domain gains the Other group and the NULL
  // category of the rows. A summary domain summarizes the lumps, whose weights order the kept
  // categories that the rows do not hold, or their keys. On a channel other than a position, a row of the Other group takes the
  // value of the `other` style element of its mark, in place of the scale's.
  oneof kind {
    option (avenger.chart.v1.required_oneof) = true;
    // The name of a column of the layer's table, whose values the mark draws as they are, such as
    // CSS colors.
    string direct_field = 2;
    // The name of a column of the layer's table, whose values go through the channel's scale.
    string scaled_field = 3;
    // A value that the mark draws as it is, in the form that the comment of the channel gives, such
    // as a CSS color.
    ValueRef direct_value = 4;
    // A data value that goes through the channel's scale, such as the position of a reference
    // line.
    ValueRef scaled_value = 5;
  }
  // The scale of the channel, which maps the `scaled_field` and `scaled_value` values of the
  // encoding and of its conditional values to what the mark draws. An encoding has a scale exactly
  // when its value or one of its conditional values is a `scaled_` value. When it is unset, the
  // encoding has the scale of the defaults of a scale's type and domain, so a scale is needed only
  // to change them.
  //
  // `x` and `y` take `scaled_` values only, because the axes and the fit of the plot need a scale.
  // The second channels of pairs, `x2`, `y2`, `theta2`, and `radius2`, never have a scale of their
  // own: their `scaled_` values go through the scale of `x`, `y`, `theta`, or `radius`, so they are
  // `scaled_` values exactly when the first channel has a scale. `longitude`, `latitude`,
  // `longitude2`, `latitude2`, `geometry`, `text`, `image`, `path`, and `detail` take no scale, so
  // their values are direct. An encoding of any other channel without a scale has no axis or
  // legend and joins no shared scale.
  Scale scale = 6;
  // Values for the rows that predicates select, in order. A row takes the value of the first
  // conditional value whose predicate selects it, and the value of the encoding when none does.
  // The position channels of every coordinate system, `detail`, and `ordering` have no conditional
  // values. The reach of a row covers every value that the encoding and its conditional values can
  // give it, so a change of a selection does not fit the domains again.
  repeated ConditionalValue conditional = 7;
  // The column that a selection through this channel records, when the encoded column derives from
  // another, such as the bounds of the bins of a histogram. With a paired channel, `x` with `x2`,
  // `y` with `y2`, `theta` with `theta2`, or `radius` with `radius2`, the two columns are the ends
  // of a range of this column: a point selection records `[x, x2)` as a range without its end, and
  // an interval selection records its range. When it is empty, a selection records the encoded
  // column. It is unset on the second channels of the pairs.
  string selection_field = 8;
  // The title of the encoded values in the axis or the legend of the channel's scale. When unset,
  // the title of a field is the name of its column, and a value has none. An empty title gives the
  // axis or the legend no title from this encoding. An axis or a legend whose own title is unset
  // takes the distinct titles of the encodings of its scale, in tree order, joined by `, `, so a
  // plot of `count` bars and a `mean` rule titles its shared `y` axis `count, mean`, and it draws
  // no title when they give none. An encoding without a scale has no axis or legend, so it has no
  // title.
  optional string title = 9;
  // Where the mark of a position channel stands in its band, from 0 at the start of the band to 1
  // at its end, on a band or a nested band scale. When unset, a point mark, such as a symbol, a
  // text, or the vertex of a line, stands at the middle of its band, and a bar or a rect spans its
  // band, from its start to its end. Valid only on `x`, `y`, `theta`, and `radius` through a band
  // or a nested band scale.
  optional double band_position = 10;
  // The level whose band holds the mark of a position channel on a nested band scale, from 0 for
  // the outermost, such as the band of a group behind the bars of its members. A band at an outer
  // level spans the bands of its members, so the bands of a level differ in width. When unset, the
  // leaf. Valid only on `x`, `y`, `theta`, and `radius` through a nested band scale, below the
  // number of its levels.
  //
  // At an outer level, only the fields of a path up to the level name its band, and the deeper
  // fields are ignored, so a row of a group, such as `{region: "East", channel: null}`, can hold
  // nulls there. The paths of the encoding then add no path to the scale's domain: the groups and
  // their bands come from the scale's other paths, and a row whose group they do not hold has no
  // band and does not draw.
  optional uint32 band_level = 11;
}

// A value of a channel for the rows that a predicate selects.
message ConditionalValue {
  // The predicate that selects the rows that take this value.
  Predicate predicate = 1 [(avenger.chart.v1.required) = true];
  // What the rows that the predicate selects draw, as for `Encoding.kind`.
  oneof kind {
    option (avenger.chart.v1.required_oneof) = true;
    // The name of a column whose values the mark draws as they are, as for `Encoding.direct_field`.
    string direct_field = 2;
    // The name of a column whose values go through the channel's scale, as for
    // `Encoding.scaled_field`.
    string scaled_field = 3;
    // A value that the mark draws as it is, as for `Encoding.direct_value`.
    ValueRef direct_value = 4;
    // A data value that goes through the channel's scale, as for `Encoding.scaled_value`.
    ValueRef scaled_value = 5;
  }
}
