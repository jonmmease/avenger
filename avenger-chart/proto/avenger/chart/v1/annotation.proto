// The options that annotate the fields, the oneofs, and the enum values of the format, which code
// generators and validators read from the descriptors. The builders of avenger-chart take the
// required fields and oneofs as the arguments of their constructors, and its reader checks them
// before its other rules.

syntax = "proto3";

package avenger.chart.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // The field always holds a value: a message or a `ValueRef` is set, a string is not empty, a
  // repeated field has an item or more, and an enum holds a value other than its zero value. On a
  // member of a oneof, the rule applies when the oneof holds the member.
  bool required = 50001;
  // The field is a shorthand of its message: a plain value fills the field, and its message
  // converts from that value with only the field set, so `title => 'Mass'` builds a title of that
  // text, `axis => FALSE` an axis that does not show, and `tracks => [200, 400]` tracks of those
  // lengths. The lifted fields and oneofs of a message are the complete list of its shorthands,
  // and they are what the first parameter of its constructor takes, which is its one positional
  // parameter, so `title('Mass', font_size => 14)` fills the same field as `title => 'Mass'`.
  //
  // A lift marks only a field of a plain value, such as a string, a number, a Boolean, an enum, a
  // `ValueRef`, or an array of them, never a field that holds a message. The lifted fields and
  // oneofs of a message take different kinds of values, such as a string and a Boolean, so a value
  // fills one field. A value alone converts to the message only when the field is its only
  // required content: `pin(1000, position => 'low')` takes the lifted value, and `pin => 1000`
  // fails, because `position` is required. Codegen fails the build when a lift breaks a rule. The
  // builders of avenger-chart convert from a lifted field that is not repeated, of a message
  // without required content.
  bool lift = 50003;
  // The name of the constructor of each element of a repeated message field, such as `level` for
  // the `levels` of an axis, so `levels => [level(...)]`. An element whose message holds only a
  // choice takes the choice's members, and its field has no element name.
  string element = 50007;
  // The string field, or each string of the repeated field, holds Typst markup, in the syntax of
  // Typst 0.15, which the text engine renders: a title's text and subtitle, unless the title's
  // syntax is plain, the credits of an attribution and their separator, the markup of labels and
  // of a tooltip's values, the labels of modes, and the label that clears a radio widget. Text
  // from the rows, such as the text of a text mark or the values of labels, is not markup. Tools
  // that read avenger-sql, such as its language server, treat the strings that fill these fields
  // as Typst. Codegen fails the build when it marks a field that does not hold strings.
  bool markup = 50009;
  // The string field holds a format pattern, in the syntax of `Chart.number_format_syntax` for a
  // number and of `Chart.datetime_format_syntax` for a date or a datetime: the format of labels, of
  // the text of a text mark, and of a tooltip's values. Tools that read avenger-sql, such as its
  // language server, treat the strings that fill these fields as format patterns. Codegen fails
  // the build when it marks a field that does not hold strings.
  bool format_pattern = 50010;
}

extend google.protobuf.OneofOptions {
  // The oneof always holds a member.
  bool required_oneof = 50002;
  // The oneof is a shorthand of its message, as `lift` marks a field: a plain value fills the
  // oneof by its members, a string that names a member without required content picks it, so
  // `scale => 'log'` builds a scale of the log type, and `projection => 'mercator'` a projection
  // of that type. A member of a plain value takes its values, and a member of a message takes the
  // shorthands of its message after the plain members.
  bool lift_oneof = 50008;
}

extend google.protobuf.EnumValueOptions {
  // How a channel of the `Channel` enum relates to scales, which decides what a string means in
  // the builder of its encoding. When unset, the channel takes no scale.
  ChannelScale channel_scale = 50004;
  // Marks a position channel of a coordinate system, such as `x`, `theta`, or `longitude`. A
  // number in the builder of an encoding of a position with a scale is a scaled value, a data value
  // such as the place of a reference line, and on any other channel a direct value.
  bool position = 50005;
}

// How a channel relates to scales, which decides what a string means in a builder.
enum ChannelScale {
  // The channel takes no scale: its values are direct, and a string names a direct field.
  CHANNEL_SCALE_NONE = 0;
  // The channel has a scale of its own, and a string names a scaled field.
  CHANNEL_SCALE_OWN = 1;
  // The channel follows the scale of its partner, such as `x2` the scale of `x`, and a string
  // names a scaled field.
  CHANNEL_SCALE_PARTNER = 2;
}
