// The axes of position scales, in Cartesian and in polar plots.

syntax = "proto3";

package avenger.chart.v1;

import "avenger/chart/v1/annotation.proto";
import "avenger/chart/v1/element.proto";
import "avenger/chart/v1/route.proto";
import "avenger/chart/v1/side.proto";
import "avenger/chart/v1/value.proto";

// The axis of a position scale: its title, its line, its ticks, their labels, and the grid lines of
// the plot at its values. A style field that is unset takes its value from the styles.
//
// In a Cartesian plot, the axis of `x` or `y` stands on a side of the plot. In a polar plot, the
// axis of `theta` runs around the outer edge, with its labels outside the circle and spokes as its
// grid lines, and the axis of `radius` runs along the spoke at its `angle`, with rings as its grid
// lines. A polar axis draws no title. A band or point scale has a value at each category, so a
// radar chart has a spoke and a label for each of its categories. The settings that only one kind
// of plot draws are invalid on the axis of the other: `orient`, `levels`, and the `text_align` and
// `vertical_align` of the labels on a polar axis, and `angle`, `route`, and the `text_orient` of
// the labels on a Cartesian axis.
message Axis {
  // Whether the scale draws this axis. When unset, it does. `false` draws no axis, as an unset
  // axis of `theta` or `radius` draws none, and an unset axis of `x` or `y` draws the default
  // axis.
  optional bool show = 1 [(avenger.chart.v1.lift) = true];
  // The title. When unset, or when its text is empty, the axis takes the titles of the encodings
  // of its scale, as `Encoding.title` describes.
  Title title = 2;
  // The side of a Cartesian plot. When unset, `x` has its axis at the bottom and `y` at the left,
  // and the second scale of a plot has its axis on the other side.
  Side orient = 3;
  // The labels of the values, which take `angle`, `text_orient` on a polar axis, and `text_align`
  // and `vertical_align` on a Cartesian axis.
  Labels labels = 4;
  // The values that the ticks, the labels, and the grid lines stand at. When unset, the ticks of
  // the scale, with a count that the axis fits to its length. On the axis of a band or a point
  // scale, only `values` is valid, and on the axis of a nested band scale, which stands at the
  // bands of its leaf, none is.
  oneof value_placement {
    // About how many ticks of the scale to stand at.
    double value_count = 5;
    // Values at a start and fixed steps, in place of the ticks of the scale.
    ValueStep value_step = 6;
    // A list of values in the type of the scale's domain, in place of the ticks of the scale:
    // numbers, dates, or timestamps, or categories of a band or point scale, which the axis labels
    // in its order.
    ValueRef values = 7;
  }
  // Whether the axis shows its ticks. When unset, the styles decide.
  optional bool ticks = 8;
  // The length of each tick, in pixels.
  optional float tick_length = 9;
  // The CSS color of the ticks.
  string tick_stroke = 10;
  // Whether the axis shows its line. When unset, the styles decide.
  optional bool rule = 11;
  // The CSS color of the line along the axis: the outer edge of the plot for an axis of `theta`.
  string rule_stroke = 12;
  // Whether the plot draws grid lines at the values of the axis. When unset, the styles decide.
  optional bool grid = 13;
  // The CSS color of the grid lines.
  string grid_stroke = 14;
  // The width of each grid line, in pixels.
  optional float grid_stroke_width = 15;
  // The options of each level of the axis of a nested band scale, outermost first, which stacks a
  // row of labels for each outer level outward from the labels of the leaf, with separators
  // between the bands of each outer level. A level past the end of the list takes the defaults.
  // Valid only on the axis of a nested band scale, with at most one entry for each level.
  repeated NestedAxisLevel levels = 16 [(avenger.chart.v1.element) = "level"];
  // The spoke that the axis of `radius` runs along, in degrees clockwise from the top. When unset,
  // the start angle of the plot. Invalid on the axis of `theta`.
  optional float angle = 17;
  // The route of the axis's lines at one radius: the rings of the grid of an axis of `radius`, and
  // the outer edge of an axis of `theta`. Circles with `ROUTE_COORDINATE`, and with
  // `ROUTE_CANVAS`, polygons whose corners are the values of `theta`, as the web and the rim of a
  // radar chart. Spokes are straight with either route.
  Route route = 18;
  // The class names of the axis, which a stylesheet selects with `.name`, as the HTML `class`
  // attribute lists them. Each is not empty and holds no whitespace.
  repeated string classes = 19;
  // An id, or empty, which a stylesheet selects with `#id`, with CSS escapes for an id that is
  // not a CSS identifier. With its partition, it identifies the axis, as `Node` describes.
  string id = 20;
}

// The options of one level of the axis of a nested band scale.
message NestedAxisLevel {
  // The labels of the level: whether the axis shows them, their angle, and the pattern of the
  // numeric and temporal values of the level, as for `Labels.format`, which takes the pattern of
  // the axis when it is empty. A leaf without labels has no ticks either. When `show` is unset,
  // the axis shows them. When `angle` is unset, the leaf takes the angle of the axis's labels, and
  // the labels of an outer level are level. The markup and the font of the labels of a level are
  // invalid, since every level takes those of the axis's labels, and so are the other settings of
  // labels.
  Labels labels = 1;
  // The part of the level in the title of an encoding of the scale whose own title is unset,
  // which joins the parts of the levels, outermost first, with ` / ` in place of the name of the
  // encoding's column. When unset, the name of the level's field. Empty leaves the level out.
  optional string title = 2;
}
