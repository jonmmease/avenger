// The enums of text that axes, legends, titles, attributions, and text marks share. A style field
// that is set is an inline style for the renderer's stylesheets, and an unset one takes its value
// from the styles, as the comment of `Chart` describes.

syntax = "proto3";

package avenger.chart.v1;

// How the text engine reads a text.
enum TextSyntax {
  // Unset, which the field gives the meaning of: a title, which the producer writes, reads as
  // `TEXT_SYNTAX_TYPST`, and the text of a text mark, which comes from rows, reads as
  // `TEXT_SYNTAX_PLAIN`.
  TEXT_SYNTAX_UNSPECIFIED = 0;
  // Literal text, whose newlines are spaces.
  TEXT_SYNTAX_PLAIN = 1;
  // Literal text, whose newlines end lines.
  TEXT_SYNTAX_PLAIN_LINES = 2;
  // Typst markup, in the syntax of Typst 0.15, where a newline is a space and `\` ends a line.
  TEXT_SYNTAX_TYPST = 3;
}

// A place along a line of text, in the direction that the text reads, as the keywords of the
// `text-align` property: the start, the center, or the end.
enum TextAlign {
  // Unset, so the comment of the field or the styles give the alignment.
  TEXT_ALIGN_UNSPECIFIED = 0;
  TEXT_ALIGN_START = 1;
  TEXT_ALIGN_CENTER = 2;
  TEXT_ALIGN_END = 3;
}

enum TextBaseline {
  // Unset, so the comment of the field or the styles give the baseline.
  TEXT_BASELINE_UNSPECIFIED = 0;
  TEXT_BASELINE_TOP = 1;
  TEXT_BASELINE_MIDDLE = 2;
  // The alphabetic baseline of the text.
  TEXT_BASELINE_ALPHABETIC = 3;
  TEXT_BASELINE_BOTTOM = 4;
}
