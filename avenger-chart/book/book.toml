[book]
title = "Avenger Chart Guide"
authors = ["Avenger Contributors"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/vega/avenger"
edit-url-template = "https://github.com/vega/avenger/edit/main/avenger-chart/book/{path}"
additional-css = ["custom.css"]

[output.html.playground]
editable = false
copyable = true

[rust]
edition = "2021"

[preprocessor.avenger]
command = "../../target/release/mdbook-avenger"