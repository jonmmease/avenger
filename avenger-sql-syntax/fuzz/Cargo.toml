[package]
name = "avenger-sql-syntax-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
avenger-sql-syntax = { path = ".." }

# The fuzz crate is a workspace of its own, outside the avenger workspace.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
